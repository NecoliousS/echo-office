<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==================== SCENE SETUP ====================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
scene.fog = new THREE.Fog(0x111111, 40, 120);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 500);
camera.position.set(0, 35, 50);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.target.set(0, 2, 0);

// ==================== LIGHTING (BRIGHT ENOUGH TO SEE) ====================
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
dirLight.position.set(30, 60, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 150;
dirLight.shadow.camera.left = -60;
dirLight.shadow.camera.right = 60;
dirLight.shadow.camera.top = 60;
dirLight.shadow.camera.bottom = -60;
dirLight.shadow.bias = -0.0005;
scene.add(dirLight);

// Room lights
const lights = [
    { pos: [-20, 12, 0], color: 0xffaa77, intensity: 0.6 },      // Reception
    { pos: [0, 12, 0], color: 0xffffff, intensity: 0.7 },         // Circular office
    { pos: [0, 12, -20], color: 0xffffff, intensity: 0.6 },      // Open plan
    { pos: [22, 12, -12], color: 0xffddaa, intensity: 0.5 },    // CEO room
    { pos: [12, 10, 0], color: 0xffffff, intensity: 0.4 },       // Hallway
];
lights.forEach(l => {
    const pl = new THREE.PointLight(l.color, l.intensity, 35);
    pl.position.set(...l.pos);
    scene.add(pl);
});

// ==================== MATERIALS ====================
const mat = {
    baseplate: new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 }),
    baseplateDark: new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9 }),
    wall: new THREE.MeshStandardMaterial({ color: 0x252525, roughness: 0.95 }),
    wallLight: new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 }),

    floorTile: new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.4, metalness: 0.1 }),
    desk: new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.3 }),
    deskDark: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3 }),

    screen: new THREE.MeshStandardMaterial({ color: 0x050510, emissive: 0x112244, emissiveIntensity: 0.8, roughness: 0.2 }),
    screenGlow: new THREE.MeshStandardMaterial({ color: 0x050510, emissive: 0x224466, emissiveIntensity: 1.2, roughness: 0.2 }),

    plantGreen: new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.8 }),

    metal: new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.3, metalness: 0.9 }),
    white: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }),
    agentBody: new THREE.MeshStandardMaterial({ color: 0x6666ff, roughness: 0.4, metalness: 0.3 }),
    agentHead: new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.3, metalness: 0.1 }),
    agentEye: new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 2 }),
};

// ==================== CHECKERBOARD BASEPLATE ====================
function createCheckerboard() {
    const group = new THREE.Group();
    const tileSize = 4;
    const rows = 30;
    const cols = 30;
    const offsetX = -(cols * tileSize) / 2;
    const offsetZ = -(rows * tileSize) / 2;

    for (let x = 0; x < cols; x++) {
        for (let z = 0; z < rows; z++) {
            const geometry = new THREE.BoxGeometry(tileSize, 0.5, tileSize);
            const isDark = (x + z) % 2 === 0;
            const mesh = new THREE.Mesh(geometry, isDark ? mat.baseplateDark : mat.baseplate);
            mesh.position.set(offsetX + x * tileSize + tileSize/2, -0.25, offsetZ + z * tileSize + tileSize/2);
            mesh.receiveShadow = true;
            group.add(mesh);
        }
    }
    return group;
}
scene.add(createCheckerboard());

// ==================== HELPERS ====================
function box(w, h, d, material, x, y, z, parent = scene) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
    m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true;
    parent.add(m);
    return m;
}
function cyl(rt, rb, h, seg, material, x, y, z, parent = scene) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), material);
    m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true;
    parent.add(m);
    return m;
}
function circ(r, segments, material, x, y, z, parent = scene) {
    const m = new THREE.Mesh(new THREE.CircleGeometry(r, segments), material);
    m.position.set(x, y, z);
    m.rotation.x = -Math.PI/2;
    m.receiveShadow = true;
    parent.add(m);
    return m;
}

// ==================== RECEPTION (LEFT SIDE) ====================
const reception = new THREE.Group();

box(18, 0.2, 14, mat.floorTile, -22, 0.1, 0, reception);
// Curved reception desk
for (let i = 0; i < 7; i++) {

    const rx = -18 + Math.cos(angle) * 3;
    const rz = Math.sin(angle) * 3;
    box(1.2, 1.1, 0.8, mat.desk, rx, 0.65, rz, reception);
}
box(0.3, 1.3, 6, mat.deskDark, -18, 0.75, 0, reception); // desk back
// Computer on desk
box(0.6, 0.5, 0.4, mat.computer, -18, 1.4, -1, reception);
box(0.5, 0.35, 0.05, mat.screen, -18, 1.65, -1, reception);
// Waiting chairs
[-5, 0, 5].forEach(z => {

    box(1.2, 1.2, 0.2, mat.chair, -26, 1.0, z + 0.5, reception); // back
});
// Reception plants
cyl(0.4, 0.3, 0.6, 8, mat.plantPot, -28, 0.3, -5, reception);
cyl(0.8, 0.8, 1.2, 8, mat.plantGreen, -28, 1.0, -5, reception);
cyl(0.4, 0.3, 0.6, 8, mat.plantPot, -28, 0.3, 5, reception);
cyl(0.7, 0.7, 1.0, 8, mat.plantLightGreen, -28, 0.9, 5, reception);
// Reception glass wall (front)
box(0.2, 4, 14, mat.glass, -30, 2, 0, reception);
box(0.3, 4.2, 0.3, mat.glassFrame, -30, 2, -7, reception);
box(0.3, 4.2, 0.3, mat.glassFrame, -30, 2, 7, reception);

// ==================== CIRCULAR OFFICE (CENTER) ====================
const circular = new THREE.Group();
// Carpet floor
circ(14, 32, mat.floorCarpet, 0, 0.05, 0, circular);
// Glass circular wall (segments)
const wallRadius = 13;
const wallSegments = 16;
for (let i = 0; i < wallSegments; i++) {
    const angle1 = (i / wallSegments) * Math.PI * 2;
    const angle2 = ((i + 1) / wallSegments) * Math.PI * 2;
    const midAngle = (angle1 + angle2) / 2;
    // Leave gaps for entrances
    if (Math.abs(midAngle - Math.PI/2) < 0.4) continue; // right entrance
    if (Math.abs(midAngle + Math.PI/2) < 0.4) continue; // left entrance
    if (Math.abs(midAngle - Math.PI) < 0.4) continue; // top entrance

    const x1 = Math.cos(angle1) * wallRadius;
    const z1 = Math.sin(angle1) * wallRadius;
    const x2 = Math.cos(angle2) * wallRadius;
    const z2 = Math.sin(angle2) * wallRadius;
    const cx = (x1 + x2) / 2;
    const cz = (z1 + z2) / 2;
    const len = Math.sqrt((x2-x1)**2 + (z2-z1)**2);
    const wall = box(len, 4, 0.2, mat.glass, cx, 2, cz, circular);
    wall.lookAt(0, 2, 0);
    // Frame posts
    cyl(0.08, 0.08, 4.2, 8, mat.glassFrame, x1, 2.1, z1, circular);
}
cyl(0.08, 0.08, 4.2, 8, mat.glassFrame, 0, 2.1, -wallRadius, circular); // top post

// 9 Workstations around perimeter
for (let i = 0; i < 9; i++) {
    const angle = (i / 9) * Math.PI * 2;
    const r = 9;
    const x = Math.cos(angle) * r;
    const z = Math.sin(angle) * r;

    // Desk
    const desk = box(2.2, 0.8, 1.2, mat.desk, x, 0.5, z, circular);
    desk.rotation.y = -angle + Math.PI/2;

    // Computer
    const cx = x + Math.cos(angle) * 0.8;
    const cz = z + Math.sin(angle) * 0.8;
    const comp = box(0.5, 0.4, 0.3, mat.computer, cx, 1.0, cz, circular);
    comp.rotation.y = -angle + Math.PI/2;
    const scr = box(0.45, 0.35, 0.05, mat.screen, cx, 1.35, cz, circular);
    scr.rotation.y = -angle + Math.PI/2;

    // Chair
    const chairX = x - Math.cos(angle) * 1.2;
    const chairZ = z - Math.sin(angle) * 1.2;
    const chair = box(1.0, 0.45, 1.0, mat.chair, chairX, 0.35, chairZ, circular);
    chair.rotation.y = -angle + Math.PI/2;
    const chairBack = box(1.0, 1.0, 0.15, mat.chair, chairX, 0.85, chairZ - 0.4, circular);
    chairBack.rotation.y = -angle + Math.PI/2;
}

// Central circular meeting table
cyl(2.5, 2.5, 0.15, 32, mat.desk, 0, 0.85, 0, circular);
cyl(0.3, 0.3, 0.85, 8, mat.metal, 0, 0.425, 0, circular); // leg
// Chairs around center table

    const back = box(0.9, 0.9, 0.12, mat.chair, cx * 0.8, 0.8, cz * 0.8, circular);

cyl(0.5, 0.4, 0.7, 8, mat.plantPot, 0, 0.35, 0, circular);

cyl(0.9, 0.9, 1.3, 8, mat.plantGreen, -9, 0.95, -15, openPlan);

// ==================== LUXURY CEO ROOM (TOP RIGHT) ====================
const ceoRoom = new THREE.Group();

ceoPlantPos.forEach(([px, pz]) => {

box(2, 1.5, 0.1, mat.white, 30, 2.5, -18.85, ceoRoom);

// ==================== ENTRANCE AREA ====================
const entrance = new THREE.Group();
// Extended floor
box(30, 0.2, 10, mat.floorTile, 0, 0.1, 22, entrance);
// Glass entrance doors
box(8, 4, 0.2, mat.glass, 0, 2, 27, entrance);
box(0.3, 4.2, 0.3, mat.glassFrame, -4, 2.1, 27, entrance);

// ==================== AGENTS (WALKING ROBOTS) ====================
const agents = [];
function createAgent(color, x, z) {
    const group = new THREE.Group();
    // Body
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.3), mat.agentBody);
    body.position.y = 1.1;
    body.castShadow = true;
    group.add(body);
    // Head
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), mat.agentHead);
    head.position.y = 1.7;
    head.castShadow = true;
    group.add(head);
    // Eyes
    const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.05), mat.agentEye);
    eyeL.position.set(-0.08, 1.75, 0.18);
    group.add(eyeL);
    const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.05), mat.agentEye);
    eyeR.position.set(0.08, 1.75, 0.18);
    group.add(eyeR);
    // Limbs
    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.7, 0.12), mat.agentBody);
    legL.position.set(-0.15, 0.35, 0);
    group.add(legL);
    const legR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.7, 0.12), mat.agentBody);
    legR.position.set(0.15, 0.35, 0);
    group.add(legR);
    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, 0.1), mat.agentBody);
    armL.position.set(-0.32, 1.1, 0);
    group.add(armL);
    const armR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, 0.1), mat.agentBody);
    armR.position.set(0.32, 1.1, 0);
    group.add(armR);

    group.position.set(x, 0, z);
    scene.add(group);

    return {
        mesh: group,
        x, z,
        targetX: x, targetZ: z,
        speed: 0.03 + Math.random() * 0.02,
        waitTime: 0,
        legL, legR, armL, armR,
        walkOffset: Math.random() * 100
    };
}

// Spawn agents in different zones
agents.push(createAgent(0x6666ff, -20, 0));      // Reception
agents.push(createAgent(0xff6666, 0, 0));         // Circular center
agents.push(createAgent(0x66ff66, 5, -5));        // Circular
agents.push(createAgent(0xffff66, -5, 5));        // Circular
agents.push(createAgent(0xff66ff, 0, -22));        // Open plan
agents.push(createAgent(0x66ffff, 5, -20));       // Open plan
agents.push(createAgent(0xffaa44, 26, -12));        // CEO room
agents.push(createAgent(0xaa44ff, 14, 0));        // Hallway
agents.push(createAgent(0x44ffaa, 0, 15));        // Entrance

// Agent path targets for each zone
const zoneTargets = [
    { x: -25, z: 0, range: 4 },    // Reception
    { x: 0, z: 0, range: 10 },     // Circular
    { x: 0, z: -22, range: 8 },    // Open plan
    { x: 26, z: -12, range: 5 },   // CEO
    { x: 14, z: 0, range: 3 },     // Hallway
    { x: 0, z: 22, range: 4 },     // Entrance
];

function pickNewTarget(agent) {
    // Pick random zone
    const zone = zoneTargets[Math.floor(Math.random() * zoneTargets.length)];
    agent.targetX = zone.x + (Math.random() - 0.5) * zone.range * 2;
    agent.targetZ = zone.z + (Math.random() - 0.5) * zone.range * 2;
}

// ==================== CAMERA CONTROLS (ARROW KEYS + +/-) ====================
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function updateCamera() {
    const speed = 0.8;
    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y = 0;
    forward.normalize();
    const right = new THREE.Vector3();
    right.crossVectors(forward, new THREE.Vector3(0, 1, 0));

    if (keys['ArrowUp'] || keys['w'] || keys['W']) {
        camera.position.addScaledVector(forward, speed);
        controls.target.addScaledVector(forward, speed);
    }
    if (keys['ArrowDown'] || keys['s'] || keys['S']) {
        camera.position.addScaledVector(forward, -speed);
        controls.target.addScaledVector(forward, -speed);
    }
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
        camera.position.addScaledVector(right, -speed);
        controls.target.addScaledVector(right, -speed);
    }
    if (keys['ArrowRight'] || keys['d'] || keys['D']) {
        camera.position.addScaledVector(right, speed);
        controls.target.addScaledVector(right, speed);
    }
    if (keys['+'] || keys['=']) {
        camera.position.addScaledVector(forward, speed * 0.5);
    }
    if (keys['-'] || keys['_']) {
        camera.position.addScaledVector(forward, -speed * 0.5);
    }
}

// ==================== ANIMATION LOOP ====================
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    const delta = clock.getDelta();

    controls.update();
    updateCamera();

    // Animate agents
    agents.forEach((agent, idx) => {
        const dx = agent.targetX - agent.mesh.position.x;
        const dz = agent.targetZ - agent.mesh.position.z;
        const dist = Math.sqrt(dx*dx + dz*dz);

        if (dist < 0.5) {
            agent.waitTime -= 0.016;
            if (agent.waitTime <= 0) {
                pickNewTarget(agent);
                agent.waitTime = 2 + Math.random() * 4;
            }
            // Idle breathing
            agent.mesh.position.y = Math.sin(time * 2 + idx) * 0.02;
            agent.legL.rotation.x = 0;
            agent.legR.rotation.x = 0;
            agent.armL.rotation.x = 0;
            agent.armR.rotation.x = 0;
        } else {
            const moveX = (dx / dist) * agent.speed;
            const moveZ = (dz / dist) * agent.speed;
            agent.mesh.position.x += moveX;
            agent.mesh.position.z += moveZ;
            agent.mesh.lookAt(agent.targetX, agent.mesh.position.y, agent.targetZ);

            // Walk animation
            const walkSpeed = 8;
            agent.legL.rotation.x = Math.sin(time * walkSpeed + agent.walkOffset) * 0.5;
            agent.legR.rotation.x = Math.sin(time * walkSpeed + agent.walkOffset + Math.PI) * 0.5;
            agent.armL.rotation.x = Math.sin(time * walkSpeed + agent.walkOffset + Math.PI) * 0.3;
            agent.armR.rotation.x = Math.sin(time * walkSpeed + agent.walkOffset) * 0.3;
            agent.mesh.position.y = Math.abs(Math.sin(time * walkSpeed * 2 + agent.walkOffset)) * 0.05;
        }
    });

    renderer.render(scene, camera);
}

// Resize handler
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
