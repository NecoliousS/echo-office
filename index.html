<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Office</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .key-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(8,8,16,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1a1a30;
            padding: 10px 20px;
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 0.75rem;
        }
        .key-bar input {
            background: #0a0a14;
            border: 1px solid #1f1f30;
            color: #fff;
            padding: 5px 8px;
            border-radius: 5px;
            width: 140px;
            font-size: 0.7rem;
        }
        .key-bar button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .key-bar .brand { color: #a855f7; font-weight: 700; margin-right: 6px; }

        .task-panel {
            position: fixed;
            top: 55px;
            left: 16px;
            z-index: 100;
            background: rgba(10,10,20,0.9);
            border: 1px solid #2a2a45;
            border-radius: 12px;
            padding: 14px 18px;
            max-width: 260px;
            backdrop-filter: blur(10px);
        }
        .task-panel h4 {
            color: #a855f7;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .task-item {
            font-size: 0.72rem;
            color: #aaa;
            padding: 5px 0;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .task-item:last-child { border-bottom: none; }
        .task-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .task-time { color: #666; margin-left: auto; font-size: 0.65rem; }

        .agent-label {
            position: fixed;
            z-index: 100;
            background: rgba(12,12,24,0.95);
            border: 1px solid #3a3a60;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #c084fc;
            pointer-events: none;
            transform: translate(-50%, -120%);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 0 15px rgba(124,58,237,0.2);
        }
        .agent-label.visible { opacity: 1; }
        .agent-label .role { color: #555; font-size: 0.62rem; display: block; margin-top: 1px; }

        .chat-panel {
            position: fixed;
            right: -450px;
            top: 50px;
            bottom: 0;
            width: 400px;
            background: rgba(8,8,16,0.98);
            backdrop-filter: blur(20px);
            border-left: 1px solid #2a2a45;
            z-index: 500;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease;
        }
        .chat-panel.open { right: 0; }
        .chat-header {
            padding: 18px 18px;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h3 { color: #a855f7; font-size: 0.95rem; }
        .chat-header .sub { color: #555; font-size: 0.7rem; }
        .close-chat { background: none; border: none; color: #444; cursor: pointer; font-size: 1.2rem; }
        .close-chat:hover { color: #fff; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.85rem;
            line-height: 1.5;
            animation: msgIn 0.2s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user {
            align-self: flex-end;
            background: #7c3aed;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.agent {
            align-self: flex-start;
            background: #11111f;
            border: 1px solid #1f1f30;
            border-bottom-left-radius: 4px;
        }
        .msg.typing { color: #666; font-style: italic; }
        .typing-dots { display: flex; gap: 3px; }
        .typing-dots span {
            width: 5px; height: 5px;
            background: #7c3aed;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .chat-input-area {
            padding: 14px;
            border-top: 1px solid #1a1a2e;
            display: flex;
            gap: 8px;
        }
        .chat-input-area input {
            flex: 1;
            background: #0a0a12;
            border: 1px solid #1f1f30;
            color: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
        }
        .chat-input-area button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
        }

        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(8,8,16,0.9);
            border: 1px solid #1f1f30;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #444;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1f1f30; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="key-bar">
        <span class="brand">◆ ECHO</span>
        <input type="password" id="geminiKey" placeholder="Gemini Key">
        <input type="password" id="groqKey" placeholder="Groq Key">
        <input type="password" id="openrouterKey" placeholder="OpenRouter Key (opt)">
        <button onclick="saveKeys()">Save</button>
    </div>

    <div class="task-panel" id="taskPanel">
        <h4>⏰ Today's Tasks</h4>
        <div id="taskList"></div>
    </div>

    <div id="canvas-container" style="width:100vw; height:100vh; position:fixed; top:0; left:0; z-index:1;"></div>

    <div class="agent-label" id="label-0"><span class="name">Director</span><span class="role">Strategy</span></div>
    <div class="agent-label" id="label-1"><span class="name">Scribe</span><span class="role">Scripts</span></div>
    <div class="agent-label" id="label-2"><span class="name">Lens</span><span class="role">Video</span></div>
    <div class="agent-label" id="label-3"><span class="name">Voice</span><span class="role">Audio</span></div>
    <div class="agent-label" id="label-4"><span class="name">Frame</span><span class="role">Design</span></div>
    <div class="agent-label" id="label-5"><span class="name">Post</span><span class="role">Upload</span></div>
    <div class="agent-label" id="label-6"><span class="name">Dealer</span><span class="role">Real Estate</span></div>
    <div class="agent-label" id="label-7"><span class="name">Hustle</span><span class="role">Web Sales</span></div>
    <div class="agent-label" id="label-8"><span class="name">Clock</span><span class="role">Schedule</span></div>

    <div class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <div>
                <h3 id="agentName">Agent</h3>
                <div class="sub" id="agentRole">Role</div>
            </div>
            <button class="close-chat" onclick="closeChat()">✕</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div class="hint" id="hint">Drag to look around • Click robot to chat</div>

    <script>
        // ==================== CONFIG ====================
        const AGENTS = [
            { name: "Director", role: "Strategy & Scheduling", color: 0x7c3aed, deskPos: { x: 0, z: -2.5 }, api: "gemini", systemPrompt: `You are Director. You manage 6 content channels: Ring Cam (daily 8PM), iMessage Horror (every other midnight), Trail Cam (Tue/Fri), The Simulation (Sun 3PM), Lost Media (bi-weekly), Restoration (Wed). You also coordinate with Dealer (real estate research) and Hustle (website pitches). When asked, give clear priorities and schedules.` },
            { name: "Scribe", role: "Scripts & Copy", color: 0x3b82f6, deskPos: { x: -2.5, z: -1 }, api: "groq", systemPrompt: `You are Scribe. You write scripts, hooks, and copy for all 6 content channels. You specialize in fake authenticity — typos, panic, broadcast interference, iMessage screenshots. Ask which channel and episode when writing.` },
            { name: "Lens", role: "Video & Visuals", color: 0x06b6d4, deskPos: { x: 2.5, z: -1 }, api: "gemini", systemPrompt: `You are Lens. You recommend video tools and write image prompts. Free tools: Google AI Studio/Veo 3.1 (best, no watermark), PixVerse (60/day), Kling AI, Hailuo AI, CapCut (assembly). Thumbnails: Pollinations.ai (unlimited, no key), Canva. Ask which channel for specific prompts.` },
            { name: "Voice", role: "Audio & TTS", color: 0x10b981, deskPos: { x: -2.5, z: 1.5 }, api: "groq", systemPrompt: `You are Voice. You recommend TTS tools and write voiceover scripts with sound cues. Free tools: AnySpeech (unlimited, no signup), TTSMaker (free), ElevenLabs (10k chars/month, best quality), Browser Web Speech API (instant). Ask which channel for audio direction.` },
            { name: "Frame", role: "Thumbnails & Design", color: 0xf59e0b, deskPos: { x: 2.5, z: 1.5 }, api: "gemini", systemPrompt: `You are Frame. You generate thumbnails via Pollinations.ai and recommend design tools. Free: Pollinations (direct URL generation), Canva, ytZolo. Ask which channel for thumbnail strategy and I'll generate a clickable Pollinations link.` },
            { name: "Post", role: "Captions & Upload", color: 0xec4899, deskPos: { x: 0, z: 2.5 }, api: "groq", systemPrompt: `You are Post. You write titles, captions, hashtags, and pinned comments for all 6 channels. Free schedulers: Later (limited), Buffer (3 channels), YouTube Studio, TikTok Studio. Ask which channel for the full posting package.` },
            { name: "Dealer", role: "Real Estate Wholesaling", color: 0xf97316, deskPos: { x: -4, z: 0 }, api: "gemini", systemPrompt: `You are Dealer. You help with real estate wholesaling. You know: Zillow (zillow.com) for finding properties, basic wholesale contract principles (assignment clause, earnest money), and that you need to find cash buyers/hedge funds to sell contracts to. You're in research phase — help the user learn and find their first deal. Suggest: driving for dollars, courthouse records, networking with investors.` },
            { name: "Hustle", role: "Website Selling", color: 0xeab308, deskPos: { x: 4, z: 0 }, api: "groq", systemPrompt: `You are Hustle. You help sell websites to businesses without them. Tools: ClientFinder.com (finds businesses without websites), Kling AI (wait — that's video. For coding: GitHub Copilot, Replit, CodePen, v0.dev, Bolt.new). Outreach: cold email templates, pricing ($500 basic, $1200 premium), portfolio building. Help the user land their first client.` },
            { name: "Clock", role: "Reminders & Schedule", color: 0xe5e7eb, deskPos: { x: 0, z: 0 }, api: "gemini", systemPrompt: `You are Clock. You track all schedules and remind the user what to do. Default schedule: Ring Cam daily 8PM, iMessage every other midnight, Trail Cam Tue/Fri, Simulation Sun 3PM, Lost Media bi-weekly (user picks), Restoration Wed, Real Estate research ongoing, Website pitches 5/week. When asked "what do I do today," list everything due. User can update schedules anytime.` }
        ];

        const POSTERS = [
            'naoya-1.jpeg', 'naoya-2.jpeg',
            'manga-loki-1.jpeg', 'manga-loki-2.jpeg',
            'phone-painting-1.jpeg', 'phone-painting-2.jpeg', 'phone-painting-3.jpeg',
            'gojo-painting-1.jpeg', 'gojo-painting-2.jpeg',
            'marvel-rivals-loki-1.jpeg',
            'marvel-rivals-painting-1.jpeg', 'marvel-rivals-painting-2.jpeg', 'marvel-rivals-painting-3.jpeg',
            'marvel-rivals-painting-4.jpeg', 'marvel-rivals-painting-5.jpeg', 'marvel-rivals-painting-6.jpeg',
            'marvel-rivals-painting-7.jpeg', 'marvel-rivals-painting-8.jpeg',
            'law-picture-1.jpeg', 'law-picture-2.jpeg', 'law-picture-3.jpeg',
            'kaido-painting-1.jpeg',
            'marvel-rivals-painting-adam.jpeg'
        ];

        const SCHEDULE = [
            { task: "Ring Cam short", channel: "Ring Cam", time: "8:00 PM", daily: true, color: "#7c3aed" },
            { task: "iMessage Horror short", channel: "iMessage", time: "12:00 AM", daily: false, color: "#3b82f6" },
            { task: "Trail Cam / Deep Sea", channel: "Trail Cam", time: "Tue/Fri", daily: false, color: "#06b6d4" },
            { task: "The Simulation episode", channel: "Simulation", time: "Sun 3PM", daily: false, color: "#10b981" },
            { task: "Lost Media doc", channel: "Lost Media", time: "Bi-weekly", daily: false, color: "#f59e0b" },
            { task: "Restoration video", channel: "Restoration", time: "Wed", daily: false, color: "#ec4899" },
            { task: "Find 3 properties", channel: "Real Estate", time: "This week", daily: false, color: "#f97316" },
            { task: "Send 5 website pitches", channel: "Web Sales", time: "This week", daily: false, color: "#eab308" }
        ];

        // ==================== STATE ====================
        let scene, camera, renderer;
        let agents = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let activeAgentIndex = null;
        let chatHistory = {};
        let isDragging = false;
        let cameraAngle = { theta: 0, phi: Math.PI / 2.5 };
        let cameraRadius = 10;
        let cameraTarget = new THREE.Vector3(0, 1.2, 0);

        document.getElementById('geminiKey').value = localStorage.getItem('geminiKey') || '';
        document.getElementById('groqKey').value = localStorage.getItem('groqKey') || '';
        document.getElementById('openrouterKey').value = localStorage.getItem('openrouterKey') || '';
        const savedHistory = localStorage.getItem('echoChatHistory');
        if (savedHistory) chatHistory = JSON.parse(savedHistory);

        function saveKeys() {
            localStorage.setItem('geminiKey', document.getElementById('geminiKey').value);
            localStorage.setItem('groqKey', document.getElementById('groqKey').value);
            localStorage.setItem('openrouterKey', document.getElementById('openrouterKey').value);
            event.target.textContent = 'Saved';
            setTimeout(() => event.target.textContent = 'Save', 1000);
        }

        function saveHistory() {
            localStorage.setItem('echoChatHistory', JSON.stringify(chatHistory));
        }

        // ==================== TASK PANEL ====================
        function updateTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            const now = new Date();
            const hour = now.getHours();

            SCHEDULE.forEach(s => {
                const div = document.createElement('div');
                div.className = 'task-item';
                div.innerHTML = `
                    <span class="task-dot" style="background:${s.color}"></span>
                    <span>${s.task}</span>
                    <span class="task-time">${s.time}</span>
                `;
                list.appendChild(div);
            });
        }
        updateTasks();

        // ==================== THREE.JS ====================
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a12);
            scene.fog = new THREE.FogExp2(0x0a0a12, 0.04);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
            updateCamera();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lights
            const ambient = new THREE.AmbientLight(0x2a1a4e, 0.4);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.set(2048, 2048);
            scene.add(dirLight);

            // Room
            buildRoom();

            // Desks
            AGENTS.forEach((agent, i) => {
                const desk = buildDesk(agent.color);
                desk.position.set(agent.deskPos.x, 0, agent.deskPos.z);
                desk.lookAt(0, 0, 0);
                scene.add(desk);

                const light = new THREE.PointLight(agent.color, 0.4, 3);
                light.position.set(agent.deskPos.x, 1.5, agent.deskPos.z);
                scene.add(light);
            });

            // Robots
            AGENTS.forEach((config, i) => {
                const robot = new Robot(i, config);
                agents.push(robot);
                scene.add(robot.mesh);
            });

            // Events
            window.addEventListener('resize', onResize);
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
            renderer.domElement.addEventListener('wheel', onWheel);
            renderer.domElement.addEventListener('click', onClick);

            setTimeout(() => document.getElementById('hint').style.opacity = '0', 6000);

            animate();
        }

        function updateCamera() {
            camera.position.x = cameraTarget.x + cameraRadius * Math.sin(cameraAngle.phi) * Math.sin(cameraAngle.theta);
            camera.position.y = cameraTarget.y + cameraRadius * Math.cos(cameraAngle.phi);
            camera.position.z = cameraTarget.z + cameraRadius * Math.sin(cameraAngle.phi) * Math.cos(cameraAngle.theta);
            camera.lookAt(cameraTarget);
        }

        // ==================== ROOM ====================
        function buildRoom() {
            const wallColor = 0x1a0a2e;
            const floorColor = 0x0f0f1a;

            // Floor
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(16, 16),
                new THREE.MeshStandardMaterial({ color: floorColor, roughness: 0.9 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Back wall
            const backWall = new THREE.Mesh(
                new THREE.PlaneGeometry(14, 5),
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.95 })
            );
            backWall.position.set(0, 2.5, -5.5);
            backWall.receiveShadow = true;
            scene.add(backWall);

            // Left wall
            const leftWall = new THREE.Mesh(
                new THREE.PlaneGeometry(12, 5),
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.95 })
            );
            leftWall.position.set(-5.5, 2.5, 0);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.receiveShadow = true;
            scene.add(leftWall);

            // Right wall
            const rightWall = new THREE.Mesh(
                new THREE.PlaneGeometry(12, 5),
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.95 })
            );
            rightWall.position.set(5.5, 2.5, 0);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.receiveShadow = true;
            scene.add(rightWall);

            // Ceiling (subtle, not fully closed)
            const ceiling = new THREE.Mesh(
                new THREE.PlaneGeometry(14, 12),
                new THREE.MeshStandardMaterial({ color: 0x0a0a14, roughness: 1 })
            );
            ceiling.position.y = 5;
            ceiling.rotation.x = Math.PI / 2;
            scene.add(ceiling);

            // 3D Logo on back wall
            buildLogo();

            // Posters
            buildPosters();

            // Hallway entrance (visual only)
            const hallFloor = new THREE.Mesh(
                new THREE.PlaneGeometry(3, 4),
                new THREE.MeshStandardMaterial({ color: 0x08080f, roughness: 0.95 })
            );
            hallFloor.rotation.x = -Math.PI / 2;
            hallFloor.position.set(0, 0.01, 7.5);
            scene.add(hallFloor);

            // Hall walls
            const hallLeft = new THREE.Mesh(
                new THREE.PlaneGeometry(4, 5),
                new THREE.MeshStandardMaterial({ color: wallColor })
            );
            hallLeft.position.set(-1.5, 2.5, 7.5);
            hallLeft.rotation.y = Math.PI / 2;
            scene.add(hallLeft);

            const hallRight = new THREE.Mesh(
                new THREE.PlaneGeometry(4, 5),
                new THREE.MeshStandardMaterial({ color: wallColor })
            );
            hallRight.position.set(1.5, 2.5, 7.5);
            hallRight.rotation.y = -Math.PI / 2;
            scene.add(hallRight);
        }

        function buildLogo() {
            const loader = new THREE.TextureLoader();
            const texture = loader.load('company-logo.png',
                (tex) => {
                    const aspect = tex.image.width / tex.image.height;
                    const w = 2.5;
                    const h = w / aspect;

                    // Backing plate
                    const plate = new THREE.Mesh(
                        new THREE.BoxGeometry(w + 0.2, h + 0.2, 0.05),
                        new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.3, metalness: 0.8 })
                    );
                    plate.position.set(0, 3.2, -5.4);
                    scene.add(plate);

                    // Logo mesh (slightly raised)
                    const logo = new THREE.Mesh(
                        new THREE.PlaneGeometry(w, h),
                        new THREE.MeshStandardMaterial({
                            map: tex,
                            transparent: true,
                            roughness: 0.2,
                            metalness: 0.5,
                            emissive: 0x7c3aed,
                            emissiveIntensity: 0.1
                        })
                    );
                    logo.position.set(0, 3.2, -5.35);
                    scene.add(logo);

                    // Glow light behind logo
                    const glow = new THREE.PointLight(0x7c3aed, 0.3, 4);
                    glow.position.set(0, 3.2, -5);
                    scene.add(glow);
                },
                undefined,
                (err) => console.log('Logo not found, skipping')
            );
        }

        function buildPosters() {
            const loader = new THREE.TextureLoader();
            const wallPositions = [
                { wall: 'left', x: -5.45, y: 2.5, z: -2, rotY: Math.PI / 2 },
                { wall: 'left', x: -5.45, y: 2.5, z: 2, rotY: Math.PI / 2 },
                { wall: 'right', x: 5.45, y: 2.5, z: -3, rotY: -Math.PI / 2 },
                { wall: 'right', x: 5.45, y: 2.5, z: 0, rotY: -Math.PI / 2 },
                { wall: 'right', x: 5.45, y: 2.5, z: 3, rotY: -Math.PI / 2 },
                { wall: 'back', x: -3, y: 2.5, z: -5.45, rotY: 0 },
                { wall: 'back', x: 3, y: 2.5, z: -5.45, rotY: 0 },
                { wall: 'back', x: 0, y: 1.5, z: -5.45, rotY: 0 }
            ];

            POSTERS.forEach((poster, i) => {
                const pos = wallPositions[i % wallPositions.length];
                if (!pos) return;

                const texture = loader.load(poster,
                    (tex) => {
                        const aspect = tex.image.width / tex.image.height;
                        const frameW = 1.2;
                        const frameH = frameW / aspect;

                        // Frame
                        const frame = new THREE.Mesh(
                            new THREE.BoxGeometry(frameW + 0.08, frameH + 0.08, 0.04),
                            new THREE.MeshStandardMaterial({ color: 0x1f1f35, roughness: 0.4, metalness: 0.6 })
                        );
                        frame.position.set(pos.x, pos.y, pos.z);
                        frame.rotation.y = pos.rotY;
                        scene.add(frame);

                        // Poster
                        const pic = new THREE.Mesh(
                            new THREE.PlaneGeometry(frameW, frameH),
                            new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 })
                        );
                        pic.position.set(
                            pos.x + (pos.wall === 'left' ? 0.03 : pos.wall === 'right' ? -0.03 : 0),
                            pos.y,
                            pos.z + (pos.wall === 'back' ? 0.03 : 0)
                        );
                        pic.rotation.y = pos.rotY;
                        scene.add(pic);

                        // Small light above poster
                        const light = new THREE.PointLight(0xffffff, 0.15, 2);
                        light.position.set(
                            pos.x + (pos.wall === 'left' ? 0.5 : pos.wall === 'right' ? -0.5 : 0),
                            pos.y + 1,
                            pos.z + (pos.wall === 'back' ? 0.5 : 0)
                        );
                        scene.add(light);
                    },
                    undefined,
                    (err) => console.log(`Poster ${poster} not found`)
                );
            });
        }

        function buildDesk(colorHex) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x151520, roughness: 0.4, metalness: 0.7 });
            const glowMat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.25 });

            // Desktop
            const top = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.04, 0.6), mat);
            top.position.y = 0.7;
            top.castShadow = true;
            group.add(top);

            // Glow edge
            const edge = new THREE.Mesh(new THREE.BoxGeometry(1.12, 0.015, 0.62), glowMat);
            edge.position.y = 0.68;
            group.add(edge);

            // Legs
            const legGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.7);
            [[-0.45, -0.22], [0.45, -0.22], [-0.45, 0.22], [0.45, 0.22]].forEach(([x, z]) => {
                const leg = new THREE.Mesh(legGeo, mat);
                leg.position.set(x, 0.35, z);
                group.add(leg);
            });

            // Monitor
            const screen = new THREE.Mesh(
                new THREE.BoxGeometry(0.35, 0.24, 0.012),
                new THREE.MeshStandardMaterial({ color: 0x000000, emissive: colorHex, emissiveIntensity: 0.4 })
            );
            screen.position.set(0, 0.95, -0.12);
            screen.rotation.x = -0.08;
            group.add(screen);

            // Stand
            const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.18), mat);
            stand.position.set(0, 0.82, -0.12);
            group.add(stand);

            return group;
        }

        // ==================== ROBOT ====================
        class Robot {
            constructor(index, config) {
                this.index = index;
                this.config = config;
                this.state = 'idle';
                this.stateTimer = Math.random() * 3;
                this.targetPos = new THREE.Vector3();
                this.interactPartner = null;
                this.hoverOffset = Math.random() * Math.PI * 2;

                this.mesh = this.buildRobot(config.color);
                const angle = Math.random() * Math.PI * 2;
                const dist = 0.5 + Math.random() * 1.5;
                this.mesh.position.set(
                    config.deskPos.x + Math.cos(angle) * dist,
                    0.5,
                    config.deskPos.z + Math.sin(angle) * dist
                );
                this.mesh.userData = { agentIndex: index };
            }

            buildRobot(colorHex) {
                const group = new THREE.Group();
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x181825, roughness: 0.5, metalness: 0.7 });
                const glowMat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.7 });
                const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.0 });

                // Body
                const body = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), bodyMat);
                body.scale.set(1, 0.9, 0.95);
                body.position.y = 0.15;
                body.castShadow = true;
                group.add(body);

                // Visor
                const visor = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.05, 0.1), glowMat);
                visor.position.set(0, 0.18, 0.12);
                group.add(visor);

                // Eyes
                const eyeGeo = new THREE.SphereGeometry(0.022, 8, 8);
                const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
                leftEye.position.set(-0.05, 0.18, 0.15);
                group.add(leftEye);
                const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
                rightEye.position.set(0.05, 0.18, 0.15);
                group.add(rightEye);

                // Antenna
                const antStem = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, 0.2), new THREE.MeshStandardMaterial({ color: 0x333344 }));
                antStem.position.set(0, 0.38, -0.04);
                group.add(antStem);

                this.antennaBall = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), glowMat);
                this.antennaBall.position.set(0, 0.48, -0.04);
                group.add(this.antennaBall);

                // Arms
                const armGeo = new THREE.CylinderGeometry(0.012, 0.01, 0.16);
                this.leftArm = new THREE.Mesh(armGeo, bodyMat);
                this.leftArm.position.set(-0.18, 0.12, 0);
                this.leftArm.rotation.z = 0.35;
                group.add(this.leftArm);

                this.rightArm = new THREE.Mesh(armGeo, bodyMat);
                this.rightArm.position.set(0.18, 0.12, 0);
                this.rightArm.rotation.z = -0.35;
                group.add(this.rightArm);

                // Hover ring
                const ringGeo = new THREE.TorusGeometry(0.18, 0.006, 8, 24);
                const ringMat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.25, transparent: true, opacity: 0.35 });
                this.hoverRing = new THREE.Mesh(ringGeo, ringMat);
                this.hoverRing.rotation.x = Math.PI / 2;
                this.hoverRing.position.y = -0.04;
                group.add(this.hoverRing);

                return group;
            }

            update(delta, time, allAgents) {
                switch(this.state) {
                    case 'idle':
                        this.stateTimer -= delta;
                        if (this.stateTimer <= 0) this.pickTarget(allAgents);
                        this.animateIdle(time);
                        break;
                    case 'walking':
                        const dist = this.mesh.position.distanceTo(this.targetPos);
                        if (dist < 0.3) {
                            this.state = 'idle';
                            this.stateTimer = 2 + Math.random() * 3;
                        } else {
                            this.moveToTarget(delta);
                            this.animateWalk(time);
                        }
                        break;
                    case 'interacting':
                        this.stateTimer -= delta;
                        if (this.stateTimer <= 0) {
                            this.state = 'idle';
                            this.stateTimer = 1;
                            this.interactPartner = null;
                        }
                        this.animateInteract(time);
                        break;
                }

                if (this.state === 'idle' || this.state === 'walking') {
                    for (let other of allAgents) {
                        if (other === this) continue;
                        if (other.state === 'interacting') continue;
                        const d = this.mesh.position.distanceTo(other.mesh.position);
                        if (d < 1.2 && Math.random() < 0.012) {
                            this.state = 'interacting';
                            this.stateTimer = 3 + Math.random() * 2;
                            this.interactPartner = other;
                            other.state = 'interacting';
                            other.stateTimer = this.stateTimer;
                            other.interactPartner = this;
                            break;
                        }
                    }
                }

                const target = this.interactPartner ? this.interactPartner.mesh.position : this.targetPos;
                const lookPos = target.clone();
                lookPos.y = this.mesh.position.y;
                const dir = new THREE.Vector3().subVectors(lookPos, this.mesh.position);
                dir.y = 0;
                if (dir.length() > 0.1) {
                    const angle = Math.atan2(dir.x, dir.z);
                    let diff = angle - this.mesh.rotation.y;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    this.mesh.rotation.y += diff * 0.06;
                }
            }

            pickTarget(allAgents) {
                const r = Math.random();
                if (r < 0.5) {
                    const desk = AGENTS[Math.floor(Math.random() * AGENTS.length)].deskPos;
                    this.targetPos.set(desk.x + (Math.random()-0.5)*2, 0.5, desk.z + (Math.random()-0.5)*2);
                } else if (r < 0.8) {
                    this.targetPos.set((Math.random()-0.5)*7, 0.5, (Math.random()-0.5)*5);
                } else {
                    const other = allAgents[Math.floor(Math.random() * allAgents.length)];
                    if (other !== this) {
                        this.targetPos.copy(other.mesh.position);
                        this.targetPos.x += (Math.random()-0.5);
                        this.targetPos.z += (Math.random()-0.5);
                    }
                }
                this.state = 'walking';
            }

            moveToTarget(delta) {
                const dir = new THREE.Vector3().subVectors(this.targetPos, this.mesh.position);
                dir.y = 0;
                const dist = dir.length();
                dir.normalize();
                const move = Math.min(dist, 0.9 * delta);
                this.mesh.position.add(dir.multiplyScalar(move));
            }

            animateIdle(time) {
                this.mesh.position.y = 0.5 + Math.sin(time * 1.5 + this.hoverOffset) * 0.035;
                this.antennaBall.material.emissiveIntensity = 0.5 + Math.sin(time * 2 + this.index) * 0.3;
                this.leftArm.rotation.z = 0.35 + Math.sin(time + this.index) * 0.04;
                this.rightArm.rotation.z = -0.35 - Math.sin(time + this.index) * 0.04;
                this.hoverRing.rotation.z = time * 0.3 + this.index;
                this.hoverRing.material.opacity = 0.3 + Math.sin(time + this.index) * 0.08;
            }

            animateWalk(time) {
                this.mesh.position.y = 0.5 + Math.sin(time * 4 + this.hoverOffset) * 0.025;
                this.mesh.rotation.x = 0.05;
                this.leftArm.rotation.z = 0.5;
                this.rightArm.rotation.z = -0.5;
                this.antennaBall.material.emissiveIntensity = 0.8;
                this.hoverRing.rotation.z = time * 1.5 + this.index;
            }

            animateInteract(time) {
                if (!this.interactPartner) return;
                this.mesh.position.y = 0.5 + Math.abs(Math.sin(time * 5)) * 0.05;
                this.antennaBall.material.emissiveIntensity = 0.4 + Math.abs(Math.sin(time * 8)) * 0.6;
                this.leftArm.rotation.z = 0.15 + Math.sin(time * 4) * 0.35;
                this.rightArm.rotation.z = -0.15 - Math.sin(time * 4 + 1) * 0.35;
                this.hoverRing.material.opacity = 0.55;
                this.hoverRing.rotation.z = time * 0.8;
            }
        }

        // ==================== INPUT ====================
        let dragStart = { x: 0, y: 0 };
        let isMouseDown = false;

        function onMouseDown(e) {
            isMouseDown = true;
            isDragging = false;
            dragStart.x = e.clientX;
            dragStart.y = e.clientY;
        }

        function onMouseMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            if (isMouseDown) {
                const dx = e.clientX - dragStart.x;
                const dy = e.clientY - dragStart.y;
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;

                if (isDragging) {
                    cameraAngle.theta -= dx * 0.005;
                    cameraAngle.phi = Math.max(0.3, Math.min(Math.PI / 2 - 0.15, cameraAngle.phi - dy * 0.005));
                    updateCamera();
                    dragStart.x = e.clientX;
                    dragStart.y = e.clientY;
                }
            }

            updateLabels();

            raycaster.setFromCamera(mouse, camera);
            let hit = false;
            for (let agent of agents) {
                const intersects = raycaster.intersectObject(agent.mesh, true);
                if (intersects.length > 0) hit = true;
            }
            document.body.style.cursor = (hit && !isDragging) ? 'pointer' : 'default';
        }

        function onMouseUp() { isMouseDown = false; }
        function onWheel(e) {
            cameraRadius = Math.max(5, Math.min(16, cameraRadius + e.deltaY * 0.01));
            updateCamera();
        }

        function onClick(e) {
            if (isDragging) return;
            raycaster.setFromCamera(mouse, camera);
            for (let agent of agents) {
                const intersects = raycaster.intersectObject(agent.mesh, true);
                if (intersects.length > 0) {
                    openChat(agent.index);
                    return;
                }
            }
        }

        function updateLabels() {
            agents.forEach((agent, i) => {
                const label = document.getElementById(`label-${i}`);
                const pos = agent.mesh.position.clone();
                pos.y += 0.65;
                pos.project(camera);

                const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(pos.y * 0.5) + 0.5) * window.innerHeight;

                if (pos.z < 1) {
                    label.style.left = x + 'px';
                    label.style.top = y + 'px';
                    label.classList.add('visible');
                } else {
                    label.classList.remove('visible');
                }
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==================== CHAT ====================
        function openChat(index) {
            activeAgentIndex = index;
            const config = AGENTS[index];
            document.getElementById('agentName').textContent = config.name;
            document.getElementById('agentRole').textContent = config.role;
            document.getElementById('chatPanel').classList.add('open');

            const container = document.getElementById('chatMessages');
            container.innerHTML = '';

            const key = `agent_${index}`;
            if (!chatHistory[key]) chatHistory[key] = [];
            chatHistory[key].forEach(msg => appendMessage(msg.role, msg.text, false));

            if (chatHistory[key].length === 0) {
                appendMessage('agent', `Hey, I'm ${config.name}. ${config.role}. What do you need today?`, false);
            }
        }

        function closeChat() {
            document.getElementById('chatPanel').classList.remove('open');
            activeAgentIndex = null;
        }

        function appendMessage(role, text, save = true) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            if (save && activeAgentIndex !== null) {
                const key = `agent_${activeAgentIndex}`;
                if (!chatHistory[key]) chatHistory[key] = [];
                chatHistory[key].push({ role, text });
                if (chatHistory[key].length > 50) chatHistory[key].shift();
                saveHistory();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || activeAgentIndex === null) return;

            input.value = '';
            appendMessage('user', text);

            const typingDiv = document.createElement('div');
            typingDiv.className = 'msg agent typing';
            typingDiv.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span> Thinking...';
            document.getElementById('chatMessages').appendChild(typingDiv);

            const response = await callAgentAPI(text);
            typingDiv.remove();
            appendMessage('agent', response || 'No response. Check API key.');
        }

        async function callAgentAPI(userMessage) {
            const config = AGENTS[activeAgentIndex];
            const key = `agent_${activeAgentIndex}`;
            const history = chatHistory[key] || [];
            const recent = history.slice(-8);

            let context = config.systemPrompt + '\n\n';
            recent.forEach(m => context += `${m.role}: ${m.text}\n`);
            context += `user: ${userMessage}`;

            if (config.api === 'gemini') {
                return await callGemini(context);
            } else {
                return await callGroq(context);
            }
        }

        async function callGemini(prompt) {
            const key = localStorage.getItem('geminiKey');
            if (!key) return 'Error: No Gemini key saved.';
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || 'Empty response';
            } catch (e) { return 'Error: ' + e.message; }
        }

        async function callGroq(prompt) {
            const key = localStorage.getItem('groqKey');
            if (!key) return 'Error: No Groq key saved.';
            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'llama3-8b-8192',
                        messages: [{ role: 'system', content: 'You are a helpful assistant.' }, { role: 'user', content: prompt }],
                        temperature: 0.7
                    })
                });
                const data = await res.json();
                return data.choices?.[0]?.message?.content || 'Empty response';
            } catch (e) { return 'Error: ' + e.message; }
        }

        // ==================== ANIMATION ====================
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            agents.forEach(agent => agent.update(delta, time, agents));
            updateLabels();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
