<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Office</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .key-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(8,8,16,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1a1a30;
            padding: 10px 20px;
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 0.75rem;
        }
        .key-bar input {
            background: #0a0a14;
            border: 1px solid #1f1f30;
            color: #fff;
            padding: 5px 8px;
            border-radius: 5px;
            width: 140px;
            font-size: 0.7rem;
        }
        .key-bar button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .key-bar .brand { color: #a855f7; font-weight: 700; margin-right: 6px; }

        .zoom-controls {
            position: fixed;
            right: 20px;
            bottom: 80px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .zoom-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(15,15,30,0.9);
            border: 1px solid #2a2a45;
            color: #a855f7;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .zoom-btn:hover {
            background: rgba(124,58,237,0.2);
            border-color: #7c3aed;
        }

        .task-panel {
            position: fixed;
            top: 55px;
            left: 16px;
            z-index: 100;
            background: rgba(10,10,20,0.92);
            border: 1px solid #2a2a45;
            border-radius: 12px;
            padding: 14px 18px;
            max-width: 280px;
            backdrop-filter: blur(10px);
        }
        .task-panel h4 {
            color: #a855f7;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .task-item {
            font-size: 0.72rem;
            color: #aaa;
            padding: 5px 0;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .task-item:last-child { border-bottom: none; }
        .task-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .task-time { color: #666; margin-left: auto; font-size: 0.65rem; }

        .agent-label {
            position: fixed;
            z-index: 100;
            background: rgba(12,12,24,0.95);
            border: 1px solid #3a3a60;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #c084fc;
            pointer-events: none;
            transform: translate(-50%, -120%);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 0 15px rgba(124,58,237,0.2);
        }
        .agent-label.visible { opacity: 1; }

        .chat-panel {
            position: fixed;
            right: -450px;
            top: 50px;
            bottom: 0;
            width: 400px;
            background: rgba(8,8,16,0.98);
            backdrop-filter: blur(20px);
            border-left: 1px solid #2a2a45;
            z-index: 500;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease;
        }
        .chat-panel.open { right: 0; }
        .chat-header {
            padding: 18px 18px;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h3 { color: #a855f7; font-size: 0.95rem; }
        .chat-header .sub { color: #555; font-size: 0.7rem; }
        .close-chat { background: none; border: none; color: #444; cursor: pointer; font-size: 1.2rem; }
        .close-chat:hover { color: #fff; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.85rem;
            line-height: 1.5;
            animation: msgIn 0.2s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user {
            align-self: flex-end;
            background: #7c3aed;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.agent {
            align-self: flex-start;
            background: #11111f;
            border: 1px solid #1f1f30;
            border-bottom-left-radius: 4px;
        }
        .msg.typing { color: #666; font-style: italic; }
        .typing-dots { display: flex; gap: 3px; }
        .typing-dots span {
            width: 5px; height: 5px;
            background: #7c3aed;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .chat-input-area {
            padding: 14px;
            border-top: 1px solid #1a1a2e;
            display: flex;
            gap: 8px;
        }
        .chat-input-area input {
            flex: 1;
            background: #0a0a12;
            border: 1px solid #1f1f30;
            color: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
        }
        .chat-input-area button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
        }

        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(8,8,16,0.9);
            border: 1px solid #1f1f30;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #444;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1f1f30; border-radius: 3px; }
    </style>
<base target="_blank">
</head>
<body>

    <div class="key-bar">
        <span class="brand">◆ ECHO</span>
        <input type="password" id="geminiKey" placeholder="Gemini Key">
        <input type="password" id="groqKey" placeholder="Groq Key">
        <input type="password" id="openrouterKey" placeholder="OpenRouter Key (opt)">
        <button onclick="saveKeys()">Save</button>
    </div>

    <div class="task-panel" id="taskPanel">
        <h4>⏰ Today's Tasks</h4>
        <div id="taskList"></div>
    </div>

    <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn()">+</button>
        <button class="zoom-btn" onclick="zoomOut()">−</button>
    </div>

    <div id="canvas-container" style="width:100vw; height:100vh; position:fixed; top:0; left:0; z-index:1;"></div>

    <div class="agent-label" id="label-0"><span class="name">Director</span><span class="role">Strategy</span></div>
    <div class="agent-label" id="label-1"><span class="name">Scribe</span><span class="role">Scripts</span></div>
    <div class="agent-label" id="label-2"><span class="name">Lens</span><span class="role">Video</span></div>
    <div class="agent-label" id="label-3"><span class="name">Voice</span><span class="role">Audio</span></div>
    <div class="agent-label" id="label-4"><span class="name">Frame</span><span class="role">Design</span></div>
    <div class="agent-label" id="label-5"><span class="name">Post</span><span class="role">Upload</span></div>
    <div class="agent-label" id="label-6"><span class="name">Dealer</span><span class="role">Real Estate</span></div>
    <div class="agent-label" id="label-7"><span class="name">Hustle</span><span class="role">Web Sales</span></div>
    <div class="agent-label" id="label-8"><span class="name">Clock</span><span class="role">Schedule</span></div>

    <div class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <div>
                <h3 id="agentName">Agent</h3>
                <div class="sub" id="agentRole">Role</div>
            </div>
            <button class="close-chat" onclick="closeChat()">✕</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div class="hint" id="hint">Drag to look around • Click agent to chat</div>

    <script>

        // ==================== CONFIG ====================
        const AGENTS = [
            { name: "Director", role: "Strategy & Scheduling", color: 0x7c3aed, deskPos: { x: 0, z: -4 }, api: "gemini", systemPrompt: `You are Director. You manage 6 content channels: Ring Cam (daily 8PM), iMessage Horror (every other midnight), Trail Cam (Tue/Fri), The Simulation (Sun 3PM), Lost Media (bi-weekly), Restoration (Wed). You also coordinate with Dealer (real estate research) and Hustle (website pitches). When asked, give clear priorities and schedules.` },
            { name: "Scribe", role: "Scripts & Copy", color: 0x3b82f6, deskPos: { x: -3.8, z: -1.8 }, api: "groq", systemPrompt: `You are Scribe. You write scripts, hooks, and copy for all 6 content channels. You specialize in fake authenticity — typos, panic, broadcast interference, iMessage screenshots. Ask which channel and episode when writing.` },
            { name: "Lens", role: "Video & Visuals", color: 0x06b6d4, deskPos: { x: 3.8, z: -1.8 }, api: "gemini", systemPrompt: `You are Lens. You recommend video tools and write image prompts. Free tools: Google AI Studio/Veo 3.1 (best, no watermark), PixVerse (60/day), Kling AI, Hailuo AI, CapCut (assembly). Thumbnails: Pollinations.ai (unlimited, no key), Canva. Ask which channel for specific prompts.` },
            { name: "Voice", role: "Audio & TTS", color: 0x10b981, deskPos: { x: -4.5, z: 1.5 }, api: "groq", systemPrompt: `You are Voice. You recommend TTS tools and write voiceover scripts with sound cues. Free tools: AnySpeech (unlimited, no signup), TTSMaker (free), ElevenLabs (10k chars/month, best quality), Browser Web Speech API (instant). Ask which channel for audio direction.` },
            { name: "Frame", role: "Thumbnails & Design", color: 0xf59e0b, deskPos: { x: 4.5, z: 1.5 }, api: "gemini", systemPrompt: `You are Frame. You generate thumbnails via Pollinations.ai and recommend design tools. Free: Pollinations (direct URL generation), Canva, ytZolo. Ask which channel for thumbnail strategy and I'll generate a clickable Pollinations link.` },
            { name: "Post", role: "Captions & Upload", color: 0xec4899, deskPos: { x: 0, z: 4.5 }, api: "groq", systemPrompt: `You are Post. You write titles, captions, hashtags, and pinned comments for all 6 channels. Free schedulers: Later (limited), Buffer (3 channels), YouTube Studio, TikTok Studio. Ask which channel for the full posting package.` },
            { name: "Dealer", role: "Real Estate Wholesaling", color: 0xf97316, deskPos: { x: -5.5, z: 0 }, api: "gemini", systemPrompt: `You are Dealer. You help with real estate wholesaling. You know: Zillow (zillow.com) for finding properties, basic wholesale contract principles (assignment clause, earnest money), and that you need to find cash buyers/hedge funds to sell contracts to. You're in research phase — help the user learn and find their first deal. Suggest: driving for dollars, courthouse records, networking with investors.` },
            { name: "Hustle", role: "Website Selling", color: 0xeab308, deskPos: { x: 5.5, z: 0 }, api: "groq", systemPrompt: `You are Hustle. You help sell websites to businesses without them. Tools: ClientFinder.com (finds businesses without websites). For coding: GitHub Copilot, Replit, CodePen, v0.dev, Bolt.new. Outreach: cold email templates, pricing ($500 basic, $1200 premium), portfolio building. Help the user land their first client.` },
            { name: "Clock", role: "Reminders & Schedule", color: 0xe5e7eb, deskPos: { x: 0, z: 0 }, api: "gemini", systemPrompt: `You are Clock. You track all schedules and remind the user what to do. When the user tells you a new schedule or task, acknowledge it and tell them you'll remember. You can update the task list. Default: Ring Cam daily 8PM, iMessage every other midnight, Trail Cam Tue/Fri, Simulation Sun 3PM, Lost Media bi-weekly, Restoration Wed, Real Estate research ongoing, Website pitches 5/week. When asked "what do I do today," list everything due.` }
        ];

        const POSTERS = [
            'naoya-1.jpeg', 'naoya-2.jpeg',
            'manga-loki-1.jpeg', 'manga-loki-2.jpeg',
            'phone-painting-1.jpeg', 'phone-painting-2.jpeg', 'phone-painting-3.jpeg',
            'gojo-painting-1.jpeg', 'gojo-painting-2.jpeg',
            'marvel-rivals-loki-1.jpeg',
            'marvel-rivals-painting-1.jpeg', 'marvel-rivals-painting-2.jpeg', 'marvel-rivals-painting-3.jpeg',
            'marvel-rivals-painting-4.jpeg', 'marvel-rivals-painting-5.jpeg', 'marvel-rivals-painting-6.jpeg',
            'marvel-rivals-painting-7.jpeg', 'marvel-rivals-painting-8.jpeg',
            'law-picture-1.jpeg', 'law-picture-2.jpeg', 'law-picture-3.jpeg',
            'kaido-painting-1.jpeg',
            'marvel-rivals-painting-adam.jpeg'
        ];

        // Room boundaries for collision detection
        const ROOMS = {
            circular: { center: { x: 0, z: 0 }, radius: 6.5, type: 'circle' },
            hallway: { x1: -2, x2: 2, z1: 6.5, z2: 12, type: 'rect' },
            ceoRoom: { x1: 2, x2: 10, z1: 6.5, z2: 14, type: 'rect' },
            reception: { x1: -10, x2: -2, z1: 6.5, z2: 14, type: 'rect' }
        };

        // ==================== STATE ====================
        let scene, camera, renderer;
        let agents = [];
        let desks = [];
        let walls = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let activeAgentIndex = null;
        let chatHistory = {};
        let isDragging = false;
        let cameraAngle = { theta: 0, phi: Math.PI / 2.5 };
        let cameraRadius = 12;
        let cameraTarget = new THREE.Vector3(0, 1.5, 0);

        document.getElementById('geminiKey').value = localStorage.getItem('geminiKey') || '';
        document.getElementById('groqKey').value = localStorage.getItem('groqKey') || '';
        document.getElementById('openrouterKey').value = localStorage.getItem('openrouterKey') || '';
        const savedHistory = localStorage.getItem('echoChatHistory');
        if (savedHistory) chatHistory = JSON.parse(savedHistory);

        function saveKeys() {
            localStorage.setItem('geminiKey', document.getElementById('geminiKey').value);
            localStorage.setItem('groqKey', document.getElementById('groqKey').value);
            localStorage.setItem('openrouterKey', document.getElementById('openrouterKey').value);
            event.target.textContent = 'Saved';
            setTimeout(() => event.target.textContent = 'Save', 1000);
        }

        function saveHistory() {
            localStorage.setItem('echoChatHistory', JSON.stringify(chatHistory));
        }

        function zoomIn() {
            cameraRadius = Math.max(4, cameraRadius - 1);
            updateCamera();
        }

        function zoomOut() {
            cameraRadius = Math.min(20, cameraRadius + 1);
            updateCamera();
        }

        // ==================== TASK PANEL ====================
        let userTasks = JSON.parse(localStorage.getItem('echoTasks') || '[]');
        const defaultTasks = [
            { task: "Ring Cam short", time: "8:00 PM", color: "#7c3aed" },
            { task: "iMessage Horror", time: "12:00 AM", color: "#3b82f6" },
            { task: "Trail Cam / Deep Sea", time: "Tue/Fri", color: "#06b6d4" },
            { task: "The Simulation", time: "Sun 3PM", color: "#10b981" },
            { task: "Lost Media doc", time: "Bi-weekly", color: "#f59e0b" },
            { task: "Restoration video", time: "Wed", color: "#ec4899" },
            { task: "Find 3 properties", time: "This week", color: "#f97316" },
            { task: "Send 5 website pitches", time: "This week", color: "#eab308" }
        ];

        function updateTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            const tasks = userTasks.length > 0 ? userTasks : defaultTasks;
            tasks.forEach(t => {
                const div = document.createElement('div');
                div.className = 'task-item';
                div.innerHTML = `<span class="task-dot" style="background:${t.color}"></span><span>${t.task}</span><span class="task-time">${t.time}</span>`;
                list.appendChild(div);
            });
        }
        updateTasks();

        function addTask(task, time, color) {
            userTasks.push({ task, time, color });
            localStorage.setItem('echoTasks', JSON.stringify(userTasks));
            updateTasks();
        }

        function removeTask(taskName) {
            userTasks = userTasks.filter(t => !t.task.includes(taskName));
            localStorage.setItem('echoTasks', JSON.stringify(userTasks));
            updateTasks();
        }

        // ==================== THREE.JS SETUP ====================
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x08080f);
            scene.fog = new THREE.FogExp2(0x08080f, 0.025);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
            updateCamera();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lights
            const ambient = new THREE.AmbientLight(0x2a1a4e, 0.3);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 0.4);
            dirLight.position.set(5, 12, 8);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.set(2048, 2048);
            scene.add(dirLight);

            // Build all rooms
            buildCircularOffice();
            buildHallway();
            buildCEORoom();
            buildReception();

            // Desks
            AGENTS.forEach((agent, i) => {
                const desk = buildDesk(agent.color);
                desk.position.set(agent.deskPos.x, 0, agent.deskPos.z);
                desk.lookAt(0, 0, 0);
                scene.add(desk);
                desks.push({ mesh: desk, pos: agent.deskPos, radius: 1.2 });

                const light = new THREE.PointLight(agent.color, 0.3, 4);
                light.position.set(agent.deskPos.x, 1.5, agent.deskPos.z);
                scene.add(light);
            });

            // Office workers
            AGENTS.forEach((config, i) => {
                const worker = new OfficeWorker(i, config);
                agents.push(worker);
                scene.add(worker.mesh);
            });

            // Events
            window.addEventListener('resize', onResize);
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
            renderer.domElement.addEventListener('wheel', onWheel);
            renderer.domElement.addEventListener('click', onClick);

            setTimeout(() => document.getElementById('hint').style.opacity = '0', 6000);

            animate();
        }

        function updateCamera() {
            camera.position.x = cameraTarget.x + cameraRadius * Math.sin(cameraAngle.phi) * Math.sin(cameraAngle.theta);
            camera.position.y = cameraTarget.y + cameraRadius * Math.cos(cameraAngle.phi);
            camera.position.z = cameraTarget.z + cameraRadius * Math.sin(cameraAngle.phi) * Math.cos(cameraAngle.theta);
            camera.lookAt(cameraTarget);
        }

        // ==================== COLLISION DETECTION ====================
        function isPointInRoom(x, z) {
            // Circular office
            const distFromCenter = Math.sqrt(x*x + z*z);
            if (distFromCenter < 6.5) return true;

            // Hallway
            if (x >= -2 && x <= 2 && z >= 6.5 && z <= 12) return true;

            // CEO Room
            if (x >= 2 && x <= 10 && z >= 6.5 && z <= 14) return true;

            // Reception
            if (x >= -10 && x <= -2 && z >= 6.5 && z <= 14) return true;

            return false;
        }

        function getNearestValidPoint(x, z) {
            // If in circular room, keep in circle
            const dist = Math.sqrt(x*x + z*z);
            if (dist < 6.5 && z < 6.5) {
                if (dist > 6.3) {
                    const angle = Math.atan2(z, x);
                    return { x: Math.cos(angle) * 6.3, z: Math.sin(angle) * 6.3 };
                }
                return { x, z };
            }

            // Hallway bounds
            if (x >= -2 && x <= 2 && z >= 6.5) {
                return { x: Math.max(-1.8, Math.min(1.8, x)), z: Math.min(11.8, z) };
            }

            // CEO room
            if (x >= 2 && z >= 6.5) {
                return { x: Math.min(9.8, x), z: Math.min(13.8, z) };
            }

            // Reception
            if (x <= -2 && z >= 6.5) {
                return { x: Math.max(-9.8, x), z: Math.min(13.8, z) };
            }

            // Default: project to nearest room entrance
            if (z < 6.5) {
                const angle = Math.atan2(z, x);
                return { x: Math.cos(angle) * 6.3, z: Math.sin(angle) * 6.3 };
            }
            return { x: Math.max(-1.8, Math.min(1.8, x)), z: 6.5 };
        }

        function checkCollision(pos, radius) {
            // Check desk collisions
            for (let desk of desks) {
                const dx = pos.x - desk.pos.x;
                const dz = pos.z - desk.pos.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                if (dist < desk.radius + radius) return true;
            }

            // Check agent collisions
            for (let agent of agents) {
                if (agent.mesh.position === pos) continue;
                const dx = pos.x - agent.mesh.position.x;
                const dz = pos.z - agent.mesh.position.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                if (dist < 0.8 + radius) return true;
            }

            return false;
        }

        // ==================== ROOM BUILDING ====================
        function buildCircularOffice() {
            const wallColor = 0x1a0a2e;
            const floorColor = 0x0d0d18;

            // Circular floor - dark wood look
            const floor = new THREE.Mesh(
                new THREE.CircleGeometry(6.5, 64),
                new THREE.MeshStandardMaterial({ color: floorColor, roughness: 0.85, metalness: 0.1 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Circular wall
            const wallGeo = new THREE.CylinderGeometry(6.5, 6.5, 5.5, 64, 1, true);
            const wallMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.9, side: THREE.BackSide });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.y = 2.75;
            wall.receiveShadow = true;
            scene.add(wall);
            walls.push({ type: 'circle', center: { x: 0, z: 0 }, radius: 6.5 });

            // Wall trim - gold accent

        function buildPosters() {
            const loader = new THREE.TextureLoader();
            const placedPositions = [];
            const wallConfigs = [];

            // Generate wall positions for circular office
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                wallConfigs.push({
                    x: Math.cos(angle) * 6.4,
                    z: Math.sin(angle) * 6.4,
                    rotY: angle + Math.PI / 2,
                    y: 1.5 + Math.random() * 2,
                    room: 'circular'
                });
            }

            // Hallway walls
            for (let i = 0; i < 4; i++) {
                wallConfigs.push({
                    x: -1.9,
                    z: 7 + i * 1.2,
                    rotY: Math.PI / 2,
                    y: 1.5 + Math.random() * 2,
                    room: 'hallway'
                });
                wallConfigs.push({
                    x: 1.9,
                    z: 7 + i * 1.2,
                    rotY: -Math.PI / 2,
                    y: 1.5 + Math.random() * 2,
                    room: 'hallway'
                });
            }

            // CEO room walls
            for (let i = 0; i < 3; i++) {
                wallConfigs.push({
                    x: 2.1,
                    z: 7 + i * 2,
                    rotY: Math.PI / 2,
                    y: 1.5 + Math.random() * 2,
                    room: 'ceo'
                });
                wallConfigs.push({
                    x: 9.9,
                    z: 7 + i * 2,
                    rotY: -Math.PI / 2,
                    y: 1.5 + Math.random() * 2,
                    room: 'ceo'
                });
            }

            // Reception walls
            for (let i = 0; i < 3; i++) {
                wallConfigs.push({
                    x: -9.9,
                    z: 7 + i * 2,
                    rotY: Math.PI / 2,
                    y: 1.5 + Math.random() * 2,
                    room: 'reception'
                });
                wallConfigs.push({
                    x: -2.1,
                    z: 7 + i * 2,
                    rotY: -Math.PI / 2,
                    y: 1.5 + Math.random() * 2,
                    room: 'reception'
                });
            }

            // Shuffle and assign posters
            const shuffled = wallConfigs.sort(() => Math.random() - 0.5);

            POSTERS.forEach((poster, i) => {
                if (i >= shuffled.length) return;
                const pos = shuffled[i];

                loader.load(poster,
                    (tex) => {
                        const aspect = tex.image.width / tex.image.height;
                        const frameW = 0.6 + Math.random() * 0.5;
                        const frameH = frameW / aspect;

                        // Check distance from other posters
                        let tooClose = false;
                        for (let p of placedPositions) {
                            const dx = p.x - pos.x;
                            const dy = p.y - pos.y;
                            const dz = p.z - pos.z;
                            if (Math.sqrt(dx*dx + dy*dy + dz*dz) < 1.5) tooClose = true;
                        }
                        if (tooClose) return;

                        placedPositions.push({ x: pos.x, y: pos.y, z: pos.z });

                        // Frame
                        const frame = new THREE.Mesh(
                            new THREE.BoxGeometry(frameW + 0.06, frameH + 0.06, 0.04),
                            new THREE.MeshStandardMaterial({ color: 0x8b7355, roughness: 0.3, metalness: 0.6 })
                        );
                        frame.position.set(pos.x, pos.y, pos.z);
                        frame.rotation.y = pos.rotY;
                        scene.add(frame);

                        // Picture
                        const pic = new THREE.Mesh(
                            new THREE.PlaneGeometry(frameW, frameH),
                            new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 })
                        );
                        const offset = 0.025;
                        pic.position.set(
                            pos.x + Math.cos(pos.rotY + Math.PI/2) * offset,
                            pos.y,
                            pos.z + Math.sin(pos.rotY + Math.PI/2) * offset
                        );
                        pic.rotation.y = pos.rotY;
                        scene.add(pic);

                        // Small spotlight above
                        const light = new THREE.PointLight(0xffffff, 0.08, 2);
                        light.position.set(
                            pos.x + Math.cos(pos.rotY + Math.PI/2) * 0.4,
                            pos.y + 0.6,
                            pos.z + Math.sin(pos.rotY + Math.PI/2) * 0.4
                        );
                        scene.add(light);
                    },
                    undefined,
                    () => console.log(`Poster ${poster} not found`)
                );
            });
        }

        class OfficeWorker {

                const handGeo = new THREE.SphereGeometry(0.04, 8, 8);
                const leftHand = new THREE.Mesh(handGeo, skinMat);
                leftHand.position.set(0, -0.2, 0);
                this.leftArm.add(leftHand);

                const rightHand = new THREE.Mesh(handGeo, skinMat);
                rightHand.position.set(0, -0.2, 0);
                this.rightArm.add(rightHand);

                // Hips
                const hips = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.2), suitMat);
                hips.position.y = 0.72;
                group.add(hips);

                // Legs
                const legGeo = new THREE.CylinderGeometry(0.055, 0.05, 0.45);
                this.leftLeg = new THREE.Mesh(legGeo, suitMat);
                this.leftLeg.position.set(-0.1, 0.42, 0);
                group.add(this.leftLeg);

                this.rightLeg = new THREE.Mesh(legGeo, suitMat);
                this.rightLeg.position.set(0.1, 0.42, 0);
                group.add(this.rightLeg);

                // Shoes
                const shoeGeo = new THREE.BoxGeometry(0.08, 0.05, 0.15);
                const shoeMat = new THREE.MeshStandardMaterial({ color: 0x0a0a12, roughness: 0.5 });
                const leftShoe = new THREE.Mesh(shoeGeo, shoeMat);
                leftShoe.position.set(0, -0.25, 0.03);
                this.leftLeg.add(leftShoe);

                const rightShoe = new THREE.Mesh(shoeGeo, shoeMat);
                rightShoe.position.set(0, -0.25, 0.03);
                this.rightLeg.add(rightShoe);

                return group;
            }

            update(delta, time, allAgents) {
                switch(this.state) {
                    case 'idle':
                        this.stateTimer -= delta;
                        if (this.stateTimer <= 0) this.pickTarget(allAgents);
                        this.animateIdle(time);
                        break;
                    case 'walking':
                        const dist = this.mesh.position.distanceTo(this.targetPos);
                        if (dist < 0.3) {
                            this.state = 'idle';
                            this.stateTimer = 2 + Math.random() * 3;
                        } else {
                            this.moveToTarget(delta, allAgents);
                            this.animateWalk(time);
                        }
                        break;
                    case 'interacting':
                        this.stateTimer -= delta;
                        if (this.stateTimer <= 0) {
                            this.state = 'idle';
                            this.stateTimer = 1;
                            this.interactPartner = null;
                        }
                        this.animateInteract(time);
                        break;
                }

                // Check for nearby workers to interact
                if (this.state === 'idle' || this.state === 'walking') {
                    for (let other of allAgents) {
                        if (other === this) continue;
                        if (other.state === 'interacting') continue;
                        const d = this.mesh.position.distanceTo(other.mesh.position);
                        if (d < 1.5 && Math.random() < 0.008) {
                            this.state = 'interacting';
                            this.stateTimer = 3 + Math.random() * 2;
                            this.interactPartner = other;
                            other.state = 'interacting';
                            other.stateTimer = this.stateTimer;
                            other.interactPartner = this;
                            break;
                        }
                    }
                }

                // Smooth look at target
                const target = this.interactPartner ? this.interactPartner.mesh.position : this.targetPos;
                const lookPos = target.clone();
                lookPos.y = this.mesh.position.y + 1.0;
                const dir = new THREE.Vector3().subVectors(lookPos, this.mesh.position);
                dir.y = 0;
                if (dir.length() > 0.1) {
                    const angle = Math.atan2(dir.x, dir.z);
                    let diff = angle - this.mesh.rotation.y;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    this.mesh.rotation.y += diff * 0.05;
                }
            }

            pickTarget(allAgents) {
                const rooms = ['circular', 'hallway', 'ceo', 'reception'];
                const room = rooms[Math.floor(Math.random() * rooms.length)];
                let x, z;

                switch(room) {
                    case 'circular':
                        const angle = Math.random() * Math.PI * 2;
                        const rad = 1 + Math.random() * 5;
                        x = Math.cos(angle) * rad;
                        z = Math.sin(angle) * rad;
                        break;
                    case 'hallway':
                        x = -1.5 + Math.random() * 3;
                        z = 7 + Math.random() * 4.5;
                        break;
                    case 'ceo':
                        x = 2.5 + Math.random() * 7;
                        z = 7 + Math.random() * 6.5;
                        break;
                    case 'reception':
                        x = -9.5 + Math.random() * 7;
                        z = 7 + Math.random() * 6.5;
                        break;
                }

                // Ensure valid position
                const valid = getNearestValidPoint(x, z);
                this.targetPos.set(valid.x, 0, valid.z);
                this.state = 'walking';
            }

            moveToTarget(delta, allAgents) {
                const dir = new THREE.Vector3().subVectors(this.targetPos, this.mesh.position);
                dir.y = 0;
                const dist = dir.length();

                if (dist < 0.1) return;

                dir.normalize();

                // Check for collisions and adjust path
                const nextPos = this.mesh.position.clone().add(dir.clone().multiplyScalar(this.walkSpeed * delta));

                // Check room bounds
                if (!isPointInRoom(nextPos.x, nextPos.z)) {
                    const valid = getNearestValidPoint(nextPos.x, nextPos.z);
                    nextPos.x = valid.x;
                    nextPos.z = valid.z;
                }

                // Check desk collisions - slide around them
                for (let desk of desks) {
                    const dx = nextPos.x - desk.pos.x;
                    const dz = nextPos.z - desk.pos.z;
                    const d = Math.sqrt(dx*dx + dz*dz);
                    if (d < desk.radius + this.collisionRadius) {
                        // Push away from desk
                        const pushDir = new THREE.Vector3(dx, 0, dz).normalize();
                        const pushDist = (desk.radius + this.collisionRadius) - d + 0.1;
                        nextPos.x += pushDir.x * pushDist;
                        nextPos.z += pushDir.z * pushDist;
                    }
                }

                // Check other agent collisions
                for (let agent of allAgents) {
                    if (agent === this) continue;
                    const dx = nextPos.x - agent.mesh.position.x;
                    const dz = nextPos.z - agent.mesh.position.z;
                    const d = Math.sqrt(dx*dx + dz*dz);
                    if (d < this.collisionRadius * 2) {
                        // Push away from other agent
                        const pushDir = new THREE.Vector3(dx, 0, dz).normalize();
                        const pushDist = (this.collisionRadius * 2) - d + 0.05;
                        nextPos.x += pushDir.x * pushDist;
                        nextPos.z += pushDir.z * pushDist;
                    }
                }

                // Final room check after adjustments
                if (!isPointInRoom(nextPos.x, nextPos.z)) {
                    const valid = getNearestValidPoint(nextPos.x, nextPos.z);
                    nextPos.x = valid.x;
                    nextPos.z = valid.z;
                }

                this.mesh.position.x = nextPos.x;
                this.mesh.position.z = nextPos.z;
            }

            animateIdle(time) {
                this.mesh.position.y = 0;
                // Breathing
                this.mesh.children[0].scale.y = 1 + Math.sin(time * 2 + this.index) * 0.01;
                // Arms sway
                this.leftArm.rotation.z = 0.1 + Math.sin(time * 1.2 + this.index) * 0.03;
                this.rightArm.rotation.z = -0.1 - Math.sin(time * 1.2 + this.index) * 0.03;
                // Head look around
                this.headGroup.rotation.y = Math.sin(time * 0.4 + this.index) * 0.25;
                // Reset legs
                this.leftLeg.rotation.x = 0;
                this.rightLeg.rotation.x = 0;
            }

            animateWalk(time) {
                const speed = 5;
                const amp = 0.35;
                // Legs walk
                this.leftLeg.rotation.x = Math.sin(time * speed + this.index * 2) * amp;
                this.rightLeg.rotation.x = Math.sin(time * speed + this.index * 2 + Math.PI) * amp;
                // Arms swing opposite
                this.leftArm.rotation.x = Math.sin(time * speed + this.index * 2 + Math.PI) * 0.2;
                this.rightArm.rotation.x = Math.sin(time * speed + this.index * 2) * 0.2;
                // Body bob
                this.mesh.position.y = Math.abs(Math.sin(time * speed * 2 + this.index)) * 0.015;
                // Head steady
                this.headGroup.rotation.x = 0.02;
            }

            animateInteract(time) {
                if (!this.interactPartner) return;
                // Gesture with hands
                this.leftArm.rotation.z = 0.3 + Math.sin(time * 4) * 0.15;
                this.rightArm.rotation.z = -0.3 - Math.sin(time * 4 + 1) * 0.15;
                this.leftArm.rotation.x = -0.3 + Math.sin(time * 3) * 0.1;
                this.rightArm.rotation.x = -0.3 + Math.sin(time * 3 + 1) * 0.1;
                // Head nod
                this.headGroup.rotation.x = Math.sin(time * 3) * 0.06;
                // Lean in
                const partnerDir = new THREE.Vector3().subVectors(this.interactPartner.mesh.position, this.mesh.position);
                this.mesh.rotation.x = partnerDir.z * 0.01;
            }
        }

        // ==================== INPUT ====================
        let dragStart = { x: 0, y: 0 };
        let isMouseDown = false;

        function onMouseDown(e) {
            isMouseDown = true;
            isDragging = false;
            dragStart.x = e.clientX;
            dragStart.y = e.clientY;
        }

        function onMouseMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            if (isMouseDown) {
                const dx = e.clientX - dragStart.x;
                const dy = e.clientY - dragStart.y;
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;

                if (isDragging) {
                    cameraAngle.theta -= dx * 0.005;
                    cameraAngle.phi = Math.max(0.3, Math.min(Math.PI / 2 - 0.1, cameraAngle.phi - dy * 0.005));
                    updateCamera();
                    dragStart.x = e.clientX;
                    dragStart.y = e.clientY;
                }
            }

            updateLabels();

            raycaster.setFromCamera(mouse, camera);
            let hit = false;
            for (let agent of agents) {
                const intersects = raycaster.intersectObject(agent.mesh, true);
                if (intersects.length > 0) hit = true;
            }
            document.body.style.cursor = (hit && !isDragging) ? 'pointer' : 'default';
        }

        function onMouseUp() { isMouseDown = false; }

        function onWheel(e) {
            cameraRadius = Math.max(4, Math.min(20, cameraRadius + e.deltaY * 0.01));
            updateCamera();
        }

        function onClick(e) {
            if (isDragging) return;
            raycaster.setFromCamera(mouse, camera);
            for (let agent of agents) {
                const intersects = raycaster.intersectObject(agent.mesh, true);
                if (intersects.length > 0) {
                    openChat(agent.index);
                    return;
                }
            }
        }

        function updateLabels() {
            agents.forEach((agent, i) => {
                const label = document.getElementById(`label-${i}`);
                const pos = agent.mesh.position.clone();
                pos.y += 1.7;
                pos.project(camera);

                const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(pos.y * 0.5) + 0.5) * window.innerHeight;

                if (pos.z < 1) {
                    label.style.left = x + 'px';
                    label.style.top = y + 'px';
                    label.classList.add('visible');
                } else {
                    label.classList.remove('visible');
                }
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==================== CHAT ====================
        function openChat(index) {
            activeAgentIndex = index;
            const config = AGENTS[index];
            document.getElementById('agentName').textContent = config.name;
            document.getElementById('agentRole').textContent = config.role;
            document.getElementById('chatPanel').classList.add('open');

            const container = document.getElementById('chatMessages');
            container.innerHTML = '';

            const key = `agent_${index}`;
            if (!chatHistory[key]) chatHistory[key] = [];
            chatHistory[key].forEach(msg => appendMessage(msg.role, msg.text, false));

            if (chatHistory[key].length === 0) {
                appendMessage('agent', `Hey, I'm ${config.name}. ${config.role}. What do you need today?`, false);
            }
        }

        function closeChat() {
            document.getElementById('chatPanel').classList.remove('open');
            activeAgentIndex = null;
        }

        function appendMessage(role, text, save = true) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            if (save && activeAgentIndex !== null) {
                const key = `agent_${activeAgentIndex}`;
                if (!chatHistory[key]) chatHistory[key] = [];
                chatHistory[key].push({ role, text });
                if (chatHistory[key].length > 50) chatHistory[key].shift();
                saveHistory();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || activeAgentIndex === null) return;

            input.value = '';
            appendMessage('user', text);

            const typingDiv = document.createElement('div');
            typingDiv.className = 'msg agent typing';
            typingDiv.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span> Thinking...';
            document.getElementById('chatMessages').appendChild(typingDiv);

            const response = await callAgentAPI(text);
            typingDiv.remove();
            appendMessage('agent', response || 'No response. Check your API key.');
        }

        async function callAgentAPI(userMessage) {
            const config = AGENTS[activeAgentIndex];
            const key = `agent_${activeAgentIndex}`;
            const history = chatHistory[key] || [];
            const recent = history.slice(-8);

            let context = config.systemPrompt + '

';
            recent.forEach(m => context += `${m.role}: ${m.text}
`);
            context += `user: ${userMessage}`;

            // Clock task management
            if (config.name === 'Clock') {
                const lower = userMessage.toLowerCase();
                if (lower.includes('add task') || lower.includes('new task')) {
                    const taskMatch = userMessage.match(/(?:add|new) task[:\s]*(.+)/i);
                    if (taskMatch) {
                        addTask(taskMatch[1], 'Custom', '#7c3aed');
                        return `✅ Added task: "${taskMatch[1]}" to your schedule. It's now visible in the Today's Tasks panel.`;
                    }
                }
                if (lower.includes('remove task') || lower.includes('delete task')) {
                    const taskMatch = userMessage.match(/(?:remove|delete) task[:\s]*(.+)/i);
                    if (taskMatch) {
                        removeTask(taskMatch[1]);
                        return `✅ Removed task matching "${taskMatch[1]}" from your schedule.`;
                    }
                }
                if (lower.includes('what do i do today') || lower.includes('schedule today')) {
                    const tasks = userTasks.length > 0 ? userTasks : defaultTasks;
                    let response = "📋 Here's what you need to do today:

";
                    tasks.forEach((t, i) => {
                        response += `${i+1}. ${t.task} — ${t.time}
`;
                    });
                    return response;
                }
            }

            if (config.api === 'gemini') {
                return await callGemini(context);
            } else {
                return await callGroq(context);
            }
        }

        async function callGemini(prompt) {
            const key = localStorage.getItem('geminiKey');
            if (!key) return 'Error: No Gemini API key saved. Paste it in the top bar and click Save.';
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || 'Empty response from Gemini.';
            } catch (e) { return 'Error calling Gemini: ' + e.message; }
        }

        async function callGroq(prompt) {
            const key = localStorage.getItem('groqKey');
            if (!key) return 'Error: No Groq API key saved. Paste it in the top bar and click Save.';
            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'llama3-8b-8192',
                        messages: [{ role: 'system', content: 'You are a helpful assistant.' }, { role: 'user', content: prompt }],
                        temperature: 0.7
                    })
                });
                const data = await res.json();
                return data.choices?.[0]?.message?.content || 'Empty response from Groq.';
            } catch (e) { return 'Error calling Groq: ' + e.message; }
        }

        // ==================== ANIMATION ====================
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            agents.forEach(agent => agent.update(delta, time, agents));
            updateLabels();
            renderer.render(scene, camera);
        }

        // Start
        init();
    </script>
</body>
</html>
