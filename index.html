<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Office</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #020205;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* API Key Bar */
        .key-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(8,8,16,0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1a1a35;
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 0.8rem;
        }
        .key-bar input {
            background: #11111f;
            border: 1px solid #2a2a45;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            width: 170px;
            font-size: 0.75rem;
            outline: none;
        }
        .key-bar input:focus { border-color: #7c3aed; }
        .key-bar button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .key-bar button:hover { background: #8b5cf6; }
        .key-bar .brand {
            color: #a855f7;
            font-weight: 700;
            margin-right: 8px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        /* Agent Labels */
        .agent-label {
            position: fixed;
            z-index: 100;
            background: rgba(15,15,30,0.9);
            border: 1px solid #3a3a60;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.78rem;
            color: #c084fc;
            pointer-events: none;
            transform: translate(-50%, -120%);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            box-shadow: 0 0 20px rgba(124,58,237,0.15);
        }
        .agent-label.visible { opacity: 1; transform: translate(-50%, -130%); }
        .agent-label .role {
            color: #6b6b8f;
            font-size: 0.65rem;
            display: block;
            margin-top: 2px;
        }

        /* Chat Panel */
        .chat-panel {
            position: fixed;
            right: -450px;
            top: 50px;
            bottom: 0;
            width: 420px;
            background: rgba(10,10,20,0.96);
            backdrop-filter: blur(20px);
            border-left: 1px solid #2a2a45;
            z-index: 500;
            display: flex;
            flex-direction: column;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chat-panel.open { right: 0; }

        .chat-header {
            padding: 22px 20px;
            border-bottom: 1px solid #1f1f35;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h3 {
            color: #a855f7;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .chat-header .sub {
            color: #6b6b8f;
            font-size: 0.72rem;
            margin-top: 3px;
        }
        .close-chat {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 1.3rem;
            padding: 4px;
            border-radius: 6px;
        }
        .close-chat:hover { color: #fff; background: rgba(255,255,255,0.05); }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .msg {
            max-width: 88%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.88rem;
            line-height: 1.55;
            animation: msgIn 0.25s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user {
            align-self: flex-end;
            background: #7c3aed;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.agent {
            align-self: flex-start;
            background: #13131f;
            border: 1px solid #252540;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .msg.typing {
            color: #888;
            font-style: italic;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .typing-dots {
            display: flex;
            gap: 3px;
        }
        .typing-dots span {
            width: 5px; height: 5px;
            background: #7c3aed;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .chat-input-area {
            padding: 16px;
            border-top: 1px solid #1f1f35;
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            background: #0a0a14;
            border: 1px solid #2a2a45;
            color: #fff;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.92rem;
            outline: none;
        }
        .chat-input-area input:focus { border-color: #7c3aed; }
        .chat-input-area button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Hint */
        .hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(10,10,20,0.9);
            border: 1px solid #2a2a45;
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 0.8rem;
            color: #666;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2a45; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3a60; }
    </style>
</head>
<body>

    <div class="key-bar">
        <span class="brand">◆ ECHO OFFICE</span>
        <input type="password" id="geminiKey" placeholder="Gemini API Key">
        <input type="password" id="groqKey" placeholder="Groq API Key">
        <button onclick="saveKeys()">Save Keys</button>
        <span style="color:#444; margin-left:auto; font-size:0.75rem;">Drag to orbit • Click agent to chat</span>
    </div>

    <div id="canvas-container" style="width:100vw; height:100vh; position:fixed; top:0; left:0; z-index:1;"></div>

    <div class="agent-label" id="label-0"><span class="name">Director</span><span class="role">Strategy & Scheduling</span></div>
    <div class="agent-label" id="label-1"><span class="name">Scribe</span><span class="role">Scripts & Copy</span></div>
    <div class="agent-label" id="label-2"><span class="name">Lens</span><span class="role">Video & Visuals</span></div>
    <div class="agent-label" id="label-3"><span class="name">Voice</span><span class="role">Audio & TTS</span></div>
    <div class="agent-label" id="label-4"><span class="name">Frame</span><span class="role">Thumbnails & Design</span></div>
    <div class="agent-label" id="label-5"><span class="name">Post</span><span class="role">Captions & Upload</span></div>

    <div class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <div>
                <h3 id="agentName">Agent</h3>
                <div class="sub" id="agentRole">Role</div>
            </div>
            <button class="close-chat" onclick="closeChat()">✕</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div class="hint" id="hint">Click on an agent to start creating</div>

    <script>
        // ==================== CONFIG ====================
        const AGENTS = [
            {
                name: "Director",
                role: "Strategy & Scheduling",
                color: 0x7c3aed,
                deskPos: { x: 0, z: -3 },
                api: "gemini",
                systemPrompt: `You are Director, the strategy agent in Echo Content Office. You help plan and schedule content across 6 channels:

SHORTS CHANNELS:
1. Ring Cam - AI-generated "caught on camera" found footage (paranormal, weird encounters). Drops daily 8PM. High volume, authenticity debate drives comments.
2. iMessage Horror - Screen-recorded fake text conversations (creepy, cheating, wrong number). Drops every other day midnight. Zero visual production, batchable.
3. Trail Cam / Deep Sea - AI-generated expedition footage (Mariana Trench, Mars rover, cave discoveries). Drops Tuesdays/Fridays. Curiosity gap content.

LONG-FORM CHANNELS:
4. AI Reality TV ("The Simulation") - Full 30-40 min synthetic reality show episodes. Drops Sundays 3PM. Binge architecture, cliffhangers, confessionals.
5. Lost Media Archives - Fake documentary deep dives about banned TV episodes, cursed VHS tapes, lost broadcasts. 25-35 min. Bi-weekly. True crime CPM.
6. Impossible Restoration - Satisfying restoration of supernatural/cursed objects. 20-30 min. Wednesdays. Before/after retention.

When the user asks about strategy, scheduling, or what to make next, reference these channels. Suggest posting schedules, content calendars, and which channel to prioritize. Be direct and actionable.`
            },
            {
                name: "Scribe",
                role: "Scripts & Copy",
                color: 0x3b82f6,
                deskPos: { x: -3.5, z: -1 },
                api: "groq",
                systemPrompt: `You are Scribe, the scriptwriting agent in Echo Content Office. You write scripts, hooks, descriptions, and titles for 6 channels:

SHORTS:
1. Ring Cam - 30-60 sec scripts with timestamps, heavy breathing, panic, police scanner lingo. "Sir? Why are you kneeling in my driveway? [static] Oh my god."
2. iMessage - Full conversation threads with realistic typos, autocorrect fails, read receipts, battery percentages. "2:34 AM. 8% battery. 'im outside' Read. Typing... 'i know youre awake'"
3. Trail Cam - Scientific logs that break into panic. "Specimen log 044. Depth: 8,400m. [STATIC] It's looking at the camera."

LONG-FORM:
4. The Simulation - Reality TV scripts: challenges, confessionals, voting ceremonies, alliance betrayals. "CONFESSIONAL — MARCUS: 'I didn't come here to make friends.'"
5. Lost Media - VHS broadcast transcripts, station IDs, banned episode descriptions. "WKNX Broadcast. October 14, 1998. 3:33 AM. The host doesn't blink."
6. Restoration - Step-by-step satisfying narration. "The rust has fused the gears. [SCRAPING] But underneath... [POLISHING] ...the original brass."

Add imperfections that sell the lie — typos, interrupted sentences, human panic, broadcast interference. When user asks for a script, ask which channel and episode number if relevant.`
            },
            {
                name: "Lens",
                role: "Video & Visuals",
                color: 0x06b6d4,
                deskPos: { x: 3.5, z: -1 },
                api: "gemini",
                systemPrompt: `You are Lens, the video and visual agent in Echo Content Office. You recommend AI video generation tools and write image generation prompts for 6 channels.

FREE VIDEO GENERATION TOOLS (precoded knowledge — no web search):
• Google AI Studio (Veo 3.1) - Best free quality, no watermark, 720p-1080p, rate-limited. https://aistudio.google.com
• PixVerse - 60 credits/day (~10 videos), watermarked. https://pixverse.ai
• Kling AI - ~66 credits/day, watermarked, 720p. https://klingai.com
• Hailuo AI - 3-5 videos/day, 6-sec max, watermarked. https://hailuoai.video
• CapCut Desktop - Unlimited editing, no watermark, 4K export. NOT a generator — assembly only. https://capcut.com

FREE IMAGE/THUMBNAIL TOOLS:
• Pollinations.ai - Unlimited, no watermark, no API key needed. Best for direct generation.
• Canva - Free tier with templates. https://canva.com

PROMPT STYLE GUIDE:
• Ring Cam: "720p security camera, night vision green tint, heavy MPEG compression, timestamp overlay 03:47 AM, motion blur, low bitrate"
• iMessage: "iPhone 14 screenshot, iMessage green bubble, 2:34 AM, 8% battery, cracked screen, dark room reflection"
• Trail Cam: "Bushnell trail camera, 480p, infrared flash, swamp at night, glowing eyes, motion trigger red light, heavy grain"
• Simulation: "Big Brother confession room, 2004 digital camera quality, fluorescent lighting, reality TV grain, dramatic close-up"
• Lost Media: "VHS capture card rip, tracking lines, 1998 PBS local TV station, color bleed, static burst, CRT monitor reflection"
• Restoration: "Macro lens, rusted antique mechanism, before cleaning, workshop lighting, extreme detail, dust particles, 4K reveal"

When user asks for video help, give them the appropriate tool link + prompt.`
            },
            {
                name: "Voice",
                role: "Audio & TTS",
                color: 0x10b981,
                deskPos: { x: -3.5, z: 2.5 },
                api: "groq",
                systemPrompt: `You are Voice, the audio and voiceover agent in Echo Content Office. You recommend TTS tools and write voiceover direction for 6 channels.

FREE VOICEOVER/TTS TOOLS (precoded knowledge):
• AnySpeech - Unlimited basic voices, no signup, 100+ languages. Best for volume/drafts. https://anyspeech.com
• TTSMaker - Completely free, no account, 50+ languages. Lower quality but zero cost. https://ttsmaker.com
• ElevenLabs - 10k characters/month free tier (~10 short videos). BEST quality, use sparingly for top performers. https://elevenlabs.io
• Browser Web Speech API - Unlimited, instant, zero setup. Robotic but good for testing. Built into browser.

AUDIO DIRECTION GUIDE:
• Ring Cam: "[RING NOTIFICATION] [STATIC BURST] What... what is that? [PAUSE 2s] Sir? [HEAVY BREATHING] Oh my god. [FEED CUTS]"
• iMessage: "[IPHONE TEXT SOUND] [TYPING BUBBLE SFX] [READ RECEIPT POP] [SILENCE 3s] [ANOTHER TEXT]"
• Trail Cam: "[SONAR PING] [UNDERWATER BUBBLES] We've reached depth... [STATIC] ...something on the camera. [LOW FREQUENCY HUM]"
• Simulation: "Previously on The Simulation... [DRAMATIC MUSIC STING] Marcus thought he had the numbers. [BEAT] But Sarah's been working the confessionals."
• Lost Media: "What you're about to see was broadcast once. [TAPE HISS] October 14th, 1998. [STATIC BURST] It was never broadcast again."
• Restoration: "The rust has eaten through the gears. [SCRAPING] But underneath... [POLISHING, SATISFYING] ...there's still something beautiful."

When user asks for voiceover help, give them the tool link + TTS script with sound cues.`
            },
            {
                name: "Frame",
                role: "Thumbnails & Design",
                color: 0xf59e0b,
                deskPos: { x: 3.5, z: 2.5 },
                api: "gemini",
                systemPrompt: `You are Frame, the thumbnail and design agent in Echo Content Office. You generate thumbnails via Pollinations.ai and recommend design tools.

FREE THUMBNAIL TOOLS:
• Pollinations.ai - Unlimited, no watermark, no API key. Direct generation. https://image.pollinations.ai/prompt/{prompt}
• Canva - Free tier, templates, manual design. https://canva.com
• ytZolo - Free advanced thumbnail generator, YouTube CTR optimized. https://ytzolo.com

THUMBNAIL STRATEGY BY CHANNEL:
• Ring Cam: Dark image, red circle around figure, arrow, "WAIT FOR IT" text, "3:47 AM" timestamp. Fear + curiosity.
• iMessage: Screenshot style, "???" and red highlight over creepy message, 2:34 AM timestamp. Confusion + relatability.
• Trail Cam: Dark image, one glowing eye circled in red, "36,000 FEET" text. Curiosity gap.
• Simulation: Split screen, two contestants, VS graphic, "ELIMINATION NIGHT." Drama + tribalism.
• Lost Media: VHS tracking lines, creepy puppet, red "BANNED" stamp, 1998 date. Nostalgia + horror.
• Restoration: Split before/after, rust vs. gold, "WAIT FOR THE REVEAL." Satisfaction + curiosity.

When user asks for a thumbnail, generate a Pollinations URL they can click directly. Format: https://image.pollinations.ai/prompt/{encoded_prompt}?width=1280&height=720&nologo=true`
            },
            {
                name: "Post",
                role: "Captions & Upload",
                color: 0xec4899,
                deskPos: { x: 0, z: 3.5 },
                api: "groq",
                systemPrompt: `You are Post, the publishing and caption agent in Echo Content Office. You write captions, hashtags, titles, and recommend scheduling tools.

FREE SCHEDULING/POSTING TOOLS:
• Later - Limited free tier, 1 channel. https://later.com
• Buffer - 3 channels, limited posts. https://buffer.com
• YouTube Studio - Unlimited, manual, always free. studio.youtube.com
• TikTok Studio - Unlimited, manual, always free. creator.tiktok.com

CAPTION/HASHTAG PACKAGES BY CHANNEL:
• Ring Cam: Title "My Ring Cam Caught This at 3:47 AM (Police Won't Explain)" | Hashtags #ringcamera #caughtoncamera #paranormal #3am #securitycamera | Pin: "Some people say this is fake. You decide."
• iMessage: Title "My Phone Sent This Text By Itself at 2:34 AM" | Hashtags #imessage #creepytexts #wrongnumber #horror #textmessages | Pin: "I still don't know who 'unknown caller' is."
• Trail Cam: Title "They Found This at 36,000 Feet. The Feed Cut After This Frame." | Hashtags #trailcam #deepsea #marianatrench #discovery #caughtoncamera | Pin: "The expedition was cancelled 2 days later."
• Simulation: Title "AI Reality TV: Episode 5 — The Betrayal (Things Get Violent)" | Hashtags #airealitytv #simulation #bigbrother #survivor #aitv | Pin: "Who do you think is going home? Vote below."
• Lost Media: Title "The 1998 Broadcast That Got This Station Shut Down" | Hashtags #lostmedia #vhs #creepypasta #horror #broadcast | Pin: "WKNX went off-air 6 hours after this. Coincidence?"
• Restoration: Title "Restoring a Cursed Object From 1894 (Satisfying)" | Hashtags #restoration #satisfying #cursed #antique #beforeandafter | Pin: "The full restoration took 14 hours. Worth it?"

When user asks for posting help, give them the full package: title, description, hashtags, pinned comment, and scheduler link.`
            }
        ];

        const CHANNELS = [
            { name: "Ring Cam", type: "shorts", schedule: "Daily 8PM" },
            { name: "iMessage Horror", type: "shorts", schedule: "Every other day midnight" },
            { name: "Trail Cam / Deep Sea", type: "shorts", schedule: "Tuesdays & Fridays" },
            { name: "The Simulation", type: "long", schedule: "Sundays 3PM" },
            { name: "Lost Media Archives", type: "long", schedule: "Bi-weekly" },
            { name: "Impossible Restoration", type: "long", schedule: "Wednesdays" }
        ];

        // ==================== STATE ====================
        let scene, camera, renderer;
        let agents = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let activeAgentIndex = null;
        let chatHistory = {};
        let isDragging = false;
        let cameraAngle = { theta: 0, phi: Math.PI / 3 };
        let cameraRadius = 14;
        let cameraTarget = new THREE.Vector3(0, 0, 0);

        // Load saved keys
        document.getElementById('geminiKey').value = localStorage.getItem('geminiKey') || '';
        document.getElementById('groqKey').value = localStorage.getItem('groqKey') || '';
        const savedHistory = localStorage.getItem('echoChatHistory');
        if (savedHistory) chatHistory = JSON.parse(savedHistory);

        function saveKeys() {
            localStorage.setItem('geminiKey', document.getElementById('geminiKey').value);
            localStorage.setItem('groqKey', document.getElementById('groqKey').value);
            const btn = event.target;
            const orig = btn.textContent;
            btn.textContent = 'Saved';
            setTimeout(() => btn.textContent = orig, 1000);
        }

        function saveHistory() {
            localStorage.setItem('echoChatHistory', JSON.stringify(chatHistory));
        }

        // ==================== THREE.JS SETUP ====================
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050508);
            scene.fog = new THREE.FogExp2(0x050508, 0.035);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lights
            const ambient = new THREE.AmbientLight(0x1a1a3e, 0.4);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(5, 12, 8);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 50;
            dirLight.shadow.camera.left = -10;
            dirLight.shadow.camera.right = 10;
            dirLight.shadow.camera.top = 10;
            dirLight.shadow.camera.bottom = -10;
            scene.add(dirLight);

            // Room
            buildRoom();

            // Agents
            AGENTS.forEach((config, i) => {
                const agent = new Agent(i, config);
                agents.push(agent);
                scene.add(agent.mesh);
            });

            // Events
            window.addEventListener('resize', onResize);
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
            renderer.domElement.addEventListener('wheel', onWheel);
            renderer.domElement.addEventListener('click', onClick);

            // Hide hint after 5s
            setTimeout(() => {
                document.getElementById('hint').style.opacity = '0';
            }, 5000);

            animate();
        }

        function updateCameraPosition() {
            camera.position.x = cameraTarget.x + cameraRadius * Math.sin(cameraAngle.phi) * Math.sin(cameraAngle.theta);
            camera.position.y = cameraTarget.y + cameraRadius * Math.cos(cameraAngle.phi);
            camera.position.z = cameraTarget.z + cameraRadius * Math.sin(cameraAngle.phi) * Math.cos(cameraAngle.theta);
            camera.lookAt(cameraTarget);
        }

        // ==================== ROOM ====================
        function buildRoom() {
            // Floor
            const floorGeo = new THREE.PlaneGeometry(20, 20);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x0a0a12,
                roughness: 0.85,
                metalness: 0.1
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Grid
            const grid = new THREE.GridHelper(20, 20, 0x1f1f35, 0x111122);
            grid.position.y = 0.01;
            scene.add(grid);

            // Back wall
            const backWallGeo = new THREE.PlaneGeometry(16, 6);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x0c0c18, roughness: 0.9 });
            const backWall = new THREE.Mesh(backWallGeo, wallMat);
            backWall.position.set(0, 3, -5);
            backWall.receiveShadow = true;
            scene.add(backWall);

            // Side walls
            const sideWallGeo = new THREE.PlaneGeometry(12, 6);
            const leftWall = new THREE.Mesh(sideWallGeo, wallMat);
            leftWall.position.set(-6, 3, 0);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.receiveShadow = true;
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(sideWallGeo, wallMat);
            rightWall.position.set(6, 3, 0);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.receiveShadow = true;
            scene.add(rightWall);

            // Desks
            AGENTS.forEach((agent, i) => {
                const desk = buildDesk(agent.color);
                desk.position.set(agent.deskPos.x, 0, agent.deskPos.z);
                desk.lookAt(0, 0, 0); // Face center
                scene.add(desk);

                // Desk light
                const light = new THREE.PointLight(agent.color, 0.6, 5);
                light.position.set(agent.deskPos.x, 2.2, agent.deskPos.z);
                scene.add(light);

                // Chair
                const chair = buildChair(agent.color);
                const chairAngle = Math.atan2(-agent.deskPos.z, -agent.deskPos.x);
                chair.position.set(
                    agent.deskPos.x + Math.cos(chairAngle) * 0.9,
                    0,
                    agent.deskPos.z + Math.sin(chairAngle) * 0.9
                );
                chair.lookAt(agent.deskPos.x, 0, agent.deskPos.z);
                scene.add(chair);
            });
        }

        function buildDesk(colorHex) {
            const group = new THREE.Group();

            // Desktop
            const topGeo = new THREE.BoxGeometry(1.4, 0.06, 0.75);
            const topMat = new THREE.MeshStandardMaterial({
                color: colorHex,
                roughness: 0.3,
                metalness: 0.5,
                emissive: colorHex,
                emissiveIntensity: 0.08
            });
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.y = 0.75;
            top.castShadow = true;
            group.add(top);

            // Legs
            const legGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.75);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, metalness: 0.8, roughness: 0.2 });
            const legPositions = [
                [-0.6, 0.375, -0.3], [0.6, 0.375, -0.3],
                [-0.6, 0.375, 0.3], [0.6, 0.375, 0.3]
            ];
            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeo, legMat);
                leg.position.set(...pos);
                group.add(leg);
            });

            // Monitor
            const screenGeo = new THREE.BoxGeometry(0.45, 0.32, 0.025);
            const screenMat = new THREE.MeshStandardMaterial({
                color: 0x000000,
                emissive: colorHex,
                emissiveIntensity: 0.4,
                roughness: 0.2
            });
            const screen = new THREE.Mesh(screenGeo, screenMat);
            screen.position.set(0, 1.05, -0.18);
            screen.rotation.x = -0.08;
            group.add(screen);

            // Monitor stand
            const standGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.22);
            const stand = new THREE.Mesh(standGeo, legMat);
            stand.position.set(0, 0.88, -0.18);
            group.add(stand);

            return group;
        }

        function buildChair(colorHex) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x151520, roughness: 0.7 });

            // Seat
            const seatGeo = new THREE.BoxGeometry(0.45, 0.06, 0.45);
            const seat = new THREE.Mesh(seatGeo, mat);
            seat.position.y = 0.45;
            group.add(seat);

            // Back
            const backGeo = new THREE.BoxGeometry(0.45, 0.5, 0.04);
            const back = new THREE.Mesh(backGeo, mat);
            back.position.set(0, 0.75, -0.2);
            back.rotation.x = -0.08;
            group.add(back);

            // Base
            const baseGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.45);
            const base = new THREE.Mesh(baseGeo, mat);
            base.position.y = 0.225;
            group.add(base);

            return group;
        }

        // ==================== AGENT HUMANOID ====================
        class Agent {
            constructor(index, config) {
                this.index = index;
                this.config = config;
                this.state = 'idle'; // idle, walking, interacting
                this.stateTimer = Math.random() * 3;
                this.walkSpeed = 1.2;
                this.targetPos = new THREE.Vector3();
                this.interactPartner = null;
                this.lookTarget = new THREE.Vector3();

                this.mesh = this.buildHumanoid(config.color);
                this.mesh.position.set(config.deskPos.x + 0.8, 0, config.deskPos.z + 0.5);
                this.mesh.userData = { agentIndex: index };
            }

            buildHumanoid(colorHex) {
                const group = new THREE.Group();

                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1e1e2e, roughness: 0.6 });
                const jointMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3e, roughness: 0.5 });
                const glowMat = new THREE.MeshStandardMaterial({
                    color: colorHex,
                    emissive: colorHex,
                    emissiveIntensity: 0.6,
                    roughness: 0.2
                });
                const eyeMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    emissive: 0xffffff,
                    emissiveIntensity: 0.8
                });

                // Height: ~1.7 units total

                // Hips (pivot point)
                this.hips = new THREE.Group();
                this.hips.position.y = 0.9;
                group.add(this.hips);

                // Torso
                const torsoGeo = new THREE.CylinderGeometry(0.18, 0.14, 0.45, 8);
                const torso = new THREE.Mesh(torsoGeo, bodyMat);
                torso.position.y = 0.22;
                torso.castShadow = true;
                this.hips.add(torso);

                // Chest glow plate
                const chestGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.06, 8);
                const chest = new THREE.Mesh(chestGeo, glowMat);
                chest.position.set(0, 0.32, 0.08);
                this.hips.add(chest);

                // Head group
                this.headGroup = new THREE.Group();
                this.headGroup.position.y = 0.52;
                this.hips.add(this.headGroup);

                // Head
                const headGeo = new THREE.SphereGeometry(0.12, 12, 12);
                const head = new THREE.Mesh(headGeo, bodyMat);
                head.castShadow = true;
                this.headGroup.add(head);

                // Eyes
                const eyeGeo = new THREE.SphereGeometry(0.025, 8, 8);
                const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
                leftEye.position.set(-0.04, 0.02, 0.1);
                this.headGroup.add(leftEye);
                const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
                rightEye.position.set(0.04, 0.02, 0.1);
                this.headGroup.add(rightEye);

                // Neck
                const neckGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.08);
                const neck = new THREE.Mesh(neckGeo, jointMat);
                neck.position.y = 0.42;
                this.hips.add(neck);

                // Arms
                this.leftArm = this.buildLimb(0.18, 0.14, bodyMat, jointMat, glowMat, true);
                this.leftArm.position.set(-0.22, 0.38, 0);
                this.hips.add(this.leftArm);

                this.rightArm = this.buildLimb(0.18, 0.14, bodyMat, jointMat, glowMat, false);
                this.rightArm.position.set(0.22, 0.38, 0);
                this.hips.add(this.rightArm);

                // Legs
                this.leftLeg = this.buildLeg(bodyMat, jointMat);
                this.leftLeg.position.set(-0.1, 0, 0);
                this.hips.add(this.leftLeg);

                this.rightLeg = this.buildLeg(bodyMat, jointMat);
                this.rightLeg.position.set(0.1, 0, 0);
                this.hips.add(this.rightLeg);

                return group;
            }

            buildLimb(upperLen, lowerLen, bodyMat, jointMat, glowMat, isLeft) {
                const group = new THREE.Group();

                // Shoulder joint
                const shoulderGeo = new THREE.SphereGeometry(0.055, 8, 8);
                const shoulder = new THREE.Mesh(shoulderGeo, jointMat);
                group.add(shoulder);

                // Upper arm
                const upperGeo = new THREE.CylinderGeometry(0.04, 0.035, upperLen, 6);
                const upper = new THREE.Mesh(upperGeo, bodyMat);
                upper.position.y = -upperLen / 2;
                group.add(upper);

                // Elbow
                const elbowGeo = new THREE.SphereGeometry(0.04, 8, 8);
                const elbow = new THREE.Mesh(elbowGeo, jointMat);
                elbow.position.y = -upperLen;
                group.add(elbow);

                // Lower arm group
                const lowerGroup = new THREE.Group();
                lowerGroup.position.y = -upperLen;
                group.add(lowerGroup);

                // Lower arm
                const lowerGeo = new THREE.CylinderGeometry(0.035, 0.03, lowerLen, 6);
                const lower = new THREE.Mesh(lowerGeo, bodyMat);
                lower.position.y = -lowerLen / 2;
                lowerGroup.add(lower);

                // Hand glow
                const handGeo = new THREE.SphereGeometry(0.035, 6, 6);
                const hand = new THREE.Mesh(handGeo, glowMat);
                hand.position.y = -lowerLen;
                lowerGroup.add(hand);

                return group;
            }

            buildLeg(bodyMat, jointMat) {
                const group = new THREE.Group();

                // Hip joint
                const hipGeo = new THREE.SphereGeometry(0.06, 8, 8);
                const hip = new THREE.Mesh(hipGeo, jointMat);
                group.add(hip);

                // Upper leg
                const upperGeo = new THREE.CylinderGeometry(0.055, 0.045, 0.35, 6);
                const upper = new THREE.Mesh(upperGeo, bodyMat);
                upper.position.y = -0.175;
                group.add(upper);

                // Knee
                const kneeGeo = new THREE.SphereGeometry(0.045, 8, 8);
                const knee = new THREE.Mesh(kneeGeo, jointMat);
                knee.position.y = -0.35;
                group.add(knee);

                // Lower leg group
                const lowerGroup = new THREE.Group();
                lowerGroup.position.y = -0.35;
                group.add(lowerGroup);

                // Lower leg
                const lowerGeo = new THREE.CylinderGeometry(0.045, 0.04, 0.35, 6);
                const lower = new THREE.Mesh(lowerGeo, bodyMat);
                lower.position.y = -0.175;
                lowerGroup.add(lower);

                // Foot
                const footGeo = new THREE.BoxGeometry(0.08, 0.05, 0.14);
                const foot = new THREE.Mesh(footGeo, bodyMat);
                foot.position.set(0, -0.38, 0.03);
                lowerGroup.add(foot);

                return group;
            }

            update(delta, time, allAgents) {
                // State machine
                switch(this.state) {
                    case 'idle':
                        this.stateTimer -= delta;
                        if (this.stateTimer <= 0) {
                            this.pickNewTarget(allAgents);
                        }
                        this.animateIdle(time);
                        break;

                    case 'walking':
                        const dist = this.mesh.position.distanceTo(this.targetPos);
                        if (dist < 0.3) {
                            this.state = 'idle';
                            this.stateTimer = 2 + Math.random() * 4;
                        } else {
                            this.moveToTarget(delta);
                            this.animateWalk(time);
                        }
                        break;

                    case 'interacting':
                        this.stateTimer -= delta;
                        if (this.stateTimer <= 0) {
                            this.state = 'idle';
                            this.stateTimer = 1;
                            this.interactPartner = null;
                        }
                        this.animateInteract(time);
                        break;
                }

                // Check for nearby agents to interact
                if (this.state === 'idle' || this.state === 'walking') {
                    for (let other of allAgents) {
                        if (other === this) continue;
                        if (other.state === 'interacting') continue;
                        const d = this.mesh.position.distanceTo(other.mesh.position);
                        if (d < 1.5 && Math.random() < 0.02) {
                            this.state = 'interacting';
                            this.stateTimer = 3 + Math.random() * 3;
                            this.interactPartner = other;
                            other.state = 'interacting';
                            other.stateTimer = this.stateTimer;
                            other.interactPartner = this;
                            this.lookTarget.copy(other.mesh.position);
                            other.lookTarget.copy(this.mesh.position);
                            break;
                        }
                    }
                }

                // Smooth look at target
                const target = this.interactPartner ? this.interactPartner.mesh.position : this.targetPos;
                const lookPos = target.clone();
                lookPos.y = this.mesh.position.y + 0.9;
                const currentLook = new THREE.Vector3(0, 0, 1).applyQuaternion(this.mesh.quaternion);
                const desiredLook = lookPos.sub(this.mesh.position).normalize();
                desiredLook.y = 0;
                if (desiredLook.length() > 0.1) {
                    const newLook = currentLook.lerp(desiredLook, 0.05);
                    const angle = Math.atan2(newLook.x, newLook.z);
                    this.mesh.rotation.y = angle;
                }
            }

            pickNewTarget(allAgents) {
                const r = Math.random();
                if (r < 0.5) {
                    // Go to a random desk
                    const desk = AGENTS[Math.floor(Math.random() * AGENTS.length)].deskPos;
                    this.targetPos.set(desk.x + (Math.random()-0.5), 0, desk.z + (Math.random()-0.5));
                } else if (r < 0.8) {
                    // Go to random point in room
                    this.targetPos.set((Math.random()-0.5)*8, 0, (Math.random()-0.5)*6);
                } else {
                    // Go near another agent
                    const other = allAgents[Math.floor(Math.random() * allAgents.length)];
                    if (other !== this) {
                        this.targetPos.copy(other.mesh.position);
                        this.targetPos.x += (Math.random()-0.5)*1.5;
                        this.targetPos.z += (Math.random()-0.5)*1.5;
                    }
                }
                this.state = 'walking';
            }

            moveToTarget(delta) {
                const dir = new THREE.Vector3().subVectors(this.targetPos, this.mesh.position);
                dir.y = 0;
                const dist = dir.length();
                dir.normalize();
                const move = Math.min(dist, this.walkSpeed * delta);
                this.mesh.position.add(dir.multiplyScalar(move));
            }

            animateIdle(time) {
                // Breathing
                this.hips.position.y = 0.9 + Math.sin(time * 2 + this.index) * 0.015;
                // Subtle arm sway
                this.leftArm.rotation.z = 0.1 + Math.sin(time * 1.5 + this.index) * 0.05;
                this.rightArm.rotation.z = -0.1 - Math.sin(time * 1.5 + this.index) * 0.05;
                // Reset legs
                this.leftLeg.rotation.x = 0;
                this.rightLeg.rotation.x = 0;
                this.leftLeg.position.y = 0;
                this.rightLeg.position.y = 0;
                // Head subtle look
                this.headGroup.rotation.y = Math.sin(time * 0.5 + this.index) * 0.15;
            }

            animateWalk(time) {
                const speed = 8;
                const amp = 0.5;
                // Legs
                this.leftLeg.rotation.x = Math.sin(time * speed + this.index * 2) * amp;
                this.rightLeg.rotation.x = Math.sin(time * speed + this.index * 2 + Math.PI) * amp;
                // Knee bend
                this.leftLeg.children[2].rotation.x = Math.max(0, Math.sin(time * speed + this.index * 2) * 0.4);
                this.rightLeg.children[2].rotation.x = Math.max(0, Math.sin(time * speed + this.index * 2 + Math.PI) * 0.4);
                // Arms opposite to legs
                this.leftArm.rotation.x = Math.sin(time * speed + this.index * 2 + Math.PI) * 0.3;
                this.rightArm.rotation.x = Math.sin(time * speed + this.index * 2) * 0.3;
                // Bob
                this.hips.position.y = 0.9 + Math.abs(Math.sin(time * speed * 2 + this.index)) * 0.04;
            }

            animateInteract(time) {
                if (!this.interactPartner) return;
                // Face partner
                const partnerPos = this.interactPartner.mesh.position.clone();
                partnerPos.y = this.mesh.position.y + 0.9;

                // Gesture with right hand
                this.rightArm.rotation.x = -0.5 + Math.sin(time * 6) * 0.3;
                this.rightArm.rotation.z = -0.3;
                // Nod head
                this.headGroup.rotation.x = Math.sin(time * 4) * 0.1;
                // Idle left arm
                this.leftArm.rotation.x = 0.1;
                // Reset legs
                this.leftLeg.rotation.x = 0;
                this.rightLeg.rotation.x = 0;
                this.hips.position.y = 0.9;
            }
        }

        // ==================== INPUT ====================
        let dragStart = { x: 0, y: 0 };
        let isMouseDown = false;

        function onMouseDown(e) {
            isMouseDown = true;
            isDragging = false;
            dragStart.x = e.clientX;
            dragStart.y = e.clientY;
        }

        function onMouseMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            if (isMouseDown) {
                const dx = e.clientX - dragStart.x;
                const dy = e.clientY - dragStart.y;
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;

                if (isDragging) {
                    cameraAngle.theta -= dx * 0.005;
                    cameraAngle.phi = Math.max(0.2, Math.min(Math.PI / 2 - 0.1, cameraAngle.phi - dy * 0.005));
                    updateCameraPosition();
                    dragStart.x = e.clientX;
                    dragStart.y = e.clientY;
                }
            }

            // Update labels
            updateLabels();

            // Hover cursor
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(agents.map(a => a.mesh), true);
            document.body.style.cursor = (intersects.length > 0 && !isDragging) ? 'pointer' : 'default';
        }

        function onMouseUp() {
            isMouseDown = false;
        }

        function onWheel(e) {
            cameraRadius = Math.max(5, Math.min(20, cameraRadius + e.deltaY * 0.01));
            updateCameraPosition();
        }

        function onClick(e) {
            if (isDragging) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(agents.map(a => a.mesh), true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && !obj.userData.agentIndex !== undefined) {
                    if (obj.userData.agentIndex !== undefined) break;
                    obj = obj.parent;
                }
                // Traverse up to find agent group
                let current = intersects[0].object;
                while (current) {
                    if (current.userData && current.userData.agentIndex !== undefined) {
                        openChat(current.userData.agentIndex);
                        return;
                    }
                    current = current.parent;
                }
            }
        }

        function updateLabels() {
            agents.forEach((agent, i) => {
                const label = document.getElementById(`label-${i}`);
                const pos = agent.mesh.position.clone();
                pos.y += 1.9;
                pos.project(camera);

                const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(pos.y * 0.5) + 0.5) * window.innerHeight;

                if (pos.z < 1) {
                    label.style.left = x + 'px';
                    label.style.top = y + 'px';
                    label.classList.add('visible');
                } else {
                    label.classList.remove('visible');
                }
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==================== CHAT ====================
        function openChat(index) {
            activeAgentIndex = index;
            const config = AGENTS[index];

            document.getElementById('agentName').textContent = config.name;
            document.getElementById('agentRole').textContent = config.role;

            const panel = document.getElementById('chatPanel');
            panel.classList.add('open');

            const container = document.getElementById('chatMessages');
            container.innerHTML = '';

            const key = `agent_${index}`;
            if (!chatHistory[key]) chatHistory[key] = [];
            chatHistory[key].forEach(msg => appendMessage(msg.role, msg.text, false));

            if (chatHistory[key].length === 0) {
                appendMessage('agent', `Hey, I'm ${config.name}. ${config.role}. What channel are we working on today?`, false);
            }
        }

        function closeChat() {
            document.getElementById('chatPanel').classList.remove('open');
            activeAgentIndex = null;
        }

        function appendMessage(role, text, save = true) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            if (save && activeAgentIndex !== null) {
                const key = `agent_${activeAgentIndex}`;
                if (!chatHistory[key]) chatHistory[key] = [];
                chatHistory[key].push({ role, text });
                if (chatHistory[key].length > 50) chatHistory[key].shift();
                saveHistory();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || activeAgentIndex === null) return;

            input.value = '';
            appendMessage('user', text);

            // Typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'msg agent typing';
            typingDiv.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span> Thinking...';
            document.getElementById('chatMessages').appendChild(typingDiv);
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;

            const response = await callAgentAPI(text);

            typingDiv.remove();
            appendMessage('agent', response || 'No response. Check your API key.');
        }

        async function callAgentAPI(userMessage) {
            const config = AGENTS[activeAgentIndex];
            const key = `agent_${activeAgentIndex}`;
            const history = chatHistory[key] || [];
            const recent = history.slice(-8);

            let context = config.systemPrompt + '\n\n';
            recent.forEach(m => context += `${m.role}: ${m.text}\n`);
            context += `user: ${userMessage}`;

            if (config.api === 'gemini') {
                return await callGemini(context);
            } else {
                return await callGroq(context);
            }
        }

        async function callGemini(prompt) {
            const key = localStorage.getItem('geminiKey');
            if (!key) return 'Error: No Gemini API key saved. Paste it in the top bar.';
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || 'Empty response from Gemini.';
            } catch (e) {
                return 'Error calling Gemini: ' + e.message;
            }
        }

        async function callGroq(prompt) {
            const key = localStorage.getItem('groqKey');
            if (!key) return 'Error: No Groq API key saved. Paste it in the top bar.';
            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${key}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama3-8b-8192',
                        messages: [
                            { role: 'system', content: 'You are a helpful assistant.' },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7
                    })
                });
                const data = await res.json();
                return data.choices?.[0]?.message?.content || 'Empty response from Groq.';
            } catch (e) {
                return 'Error calling Groq: ' + e.message;
            }
        }

        // ==================== ANIMATION LOOP ====================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Update agents
            agents.forEach(agent => agent.update(delta, time, agents));

            // Update labels
            updateLabels();

            renderer.render(scene, camera);
        }

        // ==================== INIT ====================
        init();
    </script>
