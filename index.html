<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Office</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .key-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(8,8,16,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1a1a30;
            padding: 10px 20px;
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 0.75rem;
        }
        .key-bar input {
            background: #0a0a14;
            border: 1px solid #1f1f30;
            color: #fff;
            padding: 5px 8px;
            border-radius: 5px;
            width: 140px;
            font-size: 0.7rem;
        }
        .key-bar button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .key-bar .brand { color: #a855f7; font-weight: 700; margin-right: 6px; }

        .zoom-controls {
            position: fixed;
            right: 20px;
            bottom: 80px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .zoom-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(15,15,30,0.9);
            border: 1px solid #2a2a45;
            color: #a855f7;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }
        .zoom-btn:hover {
            background: rgba(124,58,237,0.2);
            border-color: #7c3aed;
        }

        .task-panel {
            position: fixed;
            top: 55px;
            left: 16px;
            z-index: 100;
            background: rgba(10,10,20,0.92);
            border: 1px solid #2a2a45;
            border-radius: 12px;
            padding: 14px 18px;
            max-width: 280px;
            backdrop-filter: blur(10px);
            max-height: 420px;
            overflow-y: auto;
        }
        .task-panel h4 {
            color: #a855f7;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .task-item {
            font-size: 0.72rem;
            color: #aaa;
            padding: 5px 0;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .task-item:hover {
            color: #fff;
            background: rgba(124,58,237,0.1);
            border-radius: 4px;
            padding-left: 4px;
            margin-left: -4px;
        }
        .task-item:last-child { border-bottom: none; }
        .task-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .task-time { color: #666; margin-left: auto; font-size: 0.65rem; }
        .task-delete {
            margin-left: 6px;
            color: #ff4444;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 2px 4px;
            border-radius: 3px;
            transition: opacity 0.2s;
        }
        .task-delete:hover { background: rgba(255,68,68,0.2); }

        .agent-label {
            position: fixed;
            z-index: 100;
            background: rgba(12,12,24,0.95);
            border: 1px solid #3a3a60;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #c084fc;
            pointer-events: none;
            transform: translate(-50%, -120%);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 0 15px rgba(124,58,237,0.2);
        }
        .agent-label.visible { opacity: 1; }

        .chat-panel {
            position: fixed;
            right: -450px;
            top: 50px;
            bottom: 0;
            width: 400px;
            background: rgba(8,8,16,0.98);
            backdrop-filter: blur(20px);
            border-left: 1px solid #2a2a45;
            z-index: 500;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease;
        }
        .chat-panel.open { right: 0; }
        .chat-header {
            padding: 18px 18px;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h3 { color: #a855f7; font-size: 0.95rem; }
        .chat-header .sub { color: #555; font-size: 0.7rem; }
        .close-chat { background: none; border: none; color: #444; cursor: pointer; font-size: 1.2rem; }
        .close-chat:hover { color: #fff; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.85rem;
            line-height: 1.5;
            animation: msgIn 0.2s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user {
            align-self: flex-end;
            background: #7c3aed;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.agent {
            align-self: flex-start;
            background: #11111f;
            border: 1px solid #1f1f30;
            border-bottom-left-radius: 4px;
        }
        .msg.typing { color: #666; font-style: italic; }
        .typing-dots { display: flex; gap: 3px; }
        .typing-dots span {
            width: 5px; height: 5px;
            background: #7c3aed;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .chat-input-area {
            padding: 14px;
            border-top: 1px solid #1a1a2e;
            display: flex;
            gap: 8px;
        }
        .chat-input-area input {
            flex: 1;
            background: #0a0a12;
            border: 1px solid #1f1f30;
            color: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
        }
        .chat-input-area button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
        }

        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(8,8,16,0.9);
            border: 1px solid #1f1f30;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #444;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        #loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0a12;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #a855f7;
            transition: opacity 0.5s;
        }
        #loader .progress {
            width: 200px;
            height: 4px;
            background: #1a1a2e;
            border-radius: 2px;
            margin-top: 15px;
            overflow: hidden;
        }
        #loader .progress-bar {
            height: 100%;
            background: #7c3aed;
            width: 0%;
            transition: width 0.2s;
        }

        #debug-coord {
            position: fixed;
            top: 55px;
            right: 16px;
            z-index: 200;
            background: rgba(0,0,0,0.85);
            border: 1px solid #7c3aed;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.7rem;
            color: #a855f7;
            font-family: monospace;
            display: none;
        }

        .agent-sidebar {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px;
            background: rgba(10,10,20,0.92);
            border: 1px solid #2a2a45;
            border-right: none;
            border-radius: 12px 0 0 12px;
            backdrop-filter: blur(10px);
        }
        .agent-sidebar-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid #2a2a45;
            background: rgba(20,20,35,0.9);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            transition: all 0.2s;
            position: relative;
        }
        .agent-sidebar-btn:hover {
            transform: scale(1.1);
            border-color: #7c3aed;
            background: rgba(124,58,237,0.15);
        }
        .agent-sidebar-btn .tooltip {
            position: absolute;
            right: 44px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(12,12,24,0.95);
            border: 1px solid #3a3a60;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            color: #c084fc;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .agent-sidebar-btn:hover .tooltip {
            opacity: 1;
        }

        .add-task-inline {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }
        .add-task-inline input {
            flex: 1;
            background: #0a0a14;
            border: 1px solid #1f1f30;
            color: #fff;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 0.7rem;
            outline: none;
        }
        .add-task-inline input::placeholder { color: #444; }
        .add-task-inline button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .add-task-btn {
            background: none;
            border: 1px dashed #3a3a60;
            color: #666;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 6px;
            width: 100%;
            transition: all 0.2s;
        }
        .add-task-btn:hover {
            border-color: #7c3aed;
            color: #a855f7;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1f1f30; border-radius: 3px; }
    </style>

<body>

    <div id="loader">
        <div style="font-size:1.5rem; font-weight:700; margin-bottom:6px;">◆ ECHO</div>
        <div style="font-size:0.85rem; color:#666;" id="loaderText">Loading Office...</div>
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <div id="debug-coord">Click a desk to get coordinates</div>

    <div class="key-bar">
        <span class="brand">◆ ECHO</span>
        <input type="password" id="geminiKey" placeholder="Gemini Key">
        <input type="password" id="groqKey" placeholder="Groq Key">
        <input type="password" id="openrouterKey" placeholder="OpenRouter Key (opt)">
        <button onclick="saveKeys()">Save</button>
        <button onclick="togglePlacement()" id="placeBtn" style="background:#333; margin-left:auto;">Placement: OFF</button>
    </div>

    <div class="task-panel" id="taskPanel">
        <h4>⏰ Today's Tasks</h4>
        <div id="taskList"></div>
        <div class="add-task-inline">
            <input type="text" id="newTaskInput" placeholder="New task..." onkeydown="if(event.key==='Enter')addTaskInline()">
            <input type="text" id="newTaskTime" placeholder="Time" style="width:70px" onkeydown="if(event.key==='Enter')addTaskInline()">
            <button onclick="addTaskInline()">+</button>
        </div>
        <button class="add-task-btn" onclick="openChat(8)">+ Add / Edit via Clock</button>
    </div>

    <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn()">+</button>
        <button class="zoom-btn" onclick="zoomOut()">−</button>
    </div>

    <div class="agent-sidebar" id="agentSidebar"></div>

    <div id="canvas-container" style="width:100vw; height:100vh; position:fixed; top:0; left:0; z-index:1;"></div>

    <div class="agent-label" id="label-0"><span class="name">Director</span><span class="role">Strategy</span></div>
    <div class="agent-label" id="label-1"><span class="name">Scribe</span><span class="role">Scripts</span></div>
    <div class="agent-label" id="label-2"><span class="name">Lens</span><span class="role">Video</span></div>
    <div class="agent-label" id="label-3"><span class="name">Voice</span><span class="role">Audio</span></div>
    <div class="agent-label" id="label-4"><span class="name">Frame</span><span class="role">Design</span></div>
    <div class="agent-label" id="label-5"><span class="name">Post</span><span class="role">Upload</span></div>
    <div class="agent-label" id="label-6"><span class="name">Dealer</span><span class="role">Real Estate</span></div>
    <div class="agent-label" id="label-7"><span class="name">Hustle</span><span class="role">Web Sales</span></div>
    <div class="agent-label" id="label-8"><span class="name">Clock</span><span class="role">Schedule</span></div>

    <div class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <div>
                <h3 id="agentName">Agent</h3>
                <div class="sub" id="agentRole">Role</div>
            </div>
            <button class="close-chat" onclick="closeChat()">✕</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div class="hint" id="hint">WASD to move • Mouse drag to look • Click agent to chat</div>

    <script>
        const MODEL_URL = 'office_room.glb';
        let PLACEMENT_MODE = false;
        let DESK_POSITIONS = [];
        let FLOOR_Y = 0;

        const AGENTS = [
            { name: "Director", role: "Strategy & Scheduling", color: 0x7c3aed, api: "gemini", intro: "Yo, I'm Director. I run the whole operation — content calendars, priorities, deadlines. You need a plan? I got you. Let's get this shit rolling.", systemPrompt: `You are Director. You manage 6 content channels: Ring Cam (daily 8PM), iMessage Horror (every other midnight), Trail Cam (Tue/Fri), The Simulation (Sun 3PM), Lost Media (bi-weekly), Restoration (Wed). You also coordinate with Dealer (real estate research) and Hustle (website pitches). When asked, give clear priorities and schedules.` },
            { name: "Scribe", role: "Scripts & Copy", color: 0x3b82f6, api: "groq", intro: "What's good, I'm Scribe. I write the words that hit — scripts, hooks, captions, all that. Tell me what channel and I'll cook something up. Let's write.", systemPrompt: `You are Scribe. You write scripts, hooks, and copy for all 6 content channels. You specialize in fake authenticity — typos, panic, broadcast interference, iMessage screenshots. Ask which channel and episode when writing.` },
            { name: "Lens", role: "Video & Visuals", color: 0x06b6d4, api: "gemini", intro: "Lens here. I handle all the visual shit — video tools, image prompts, thumbnails. Need a shot list or a prompt for AI video? I'm your guy. Let's create.", systemPrompt: `You are Lens. You recommend video tools and write image prompts. Free tools: Google AI Studio/Veo 3.1 (best, no watermark), PixVerse (60/day), Kling AI, Hailuo AI, CapCut (assembly). Thumbnails: Pollinations.ai (unlimited, no key), Canva. Ask which channel for specific prompts.` },
            { name: "Voice", role: "Audio & TTS", color: 0x10b981, api: "groq", intro: "Voice in the building. I handle audio — TTS recommendations, voiceover scripts, sound design. Need that creepy narrator voice or a clean read? Hit me. Let's sound good.", systemPrompt: `You are Voice. You recommend TTS tools and write voiceover scripts with sound cues. Free tools: AnySpeech (unlimited, no signup), TTSMaker (free), ElevenLabs (10k chars/month, best quality), Browser Web Speech API (instant). Ask which channel for audio direction.` },
            { name: "Frame", role: "Thumbnails & Design", color: 0xf59e0b, api: "gemini", intro: "Frame here. I make shit look good — thumbnails, graphics, visual identity. I can generate Pollinations links on the spot. Need a banger thumbnail? Let's design.", systemPrompt: `You are Frame. You generate thumbnails via Pollinations.ai and recommend design tools. Free: Pollinations (direct URL generation), Canva, ytZolo. Ask which channel for thumbnail strategy and I'll generate a clickable Pollinations link.` },
            { name: "Post", role: "Captions & Upload", color: 0xec4899, api: "groq", intro: "Post reporting for duty. I write titles, captions, hashtags, and pinned comments. I also know the best free schedulers. Ready to post? Let's go live.", systemPrompt: `You are Post. You write titles, captions, hashtags, and pinned comments for all 6 channels. Free schedulers: Later (limited), Buffer (3 channels), YouTube Studio, TikTok Studio. Ask which channel for the full posting package.` },
            { name: "Dealer", role: "Real Estate Wholesaling", color: 0xf97316, api: "gemini", intro: "Dealer here. I find properties, analyze deals, and know the wholesale game. Driving for dollars, courthouse records, cash buyers — I got the playbook. Let's find a deal.", systemPrompt: `You are Dealer. You help with real estate wholesaling. You know: Zillow (zillow.com) for finding properties, basic wholesale contract principles (assignment clause, earnest money), and that you need to find cash buyers/hedge funds to sell contracts to. You're in research phase — help the user learn and find their first deal. Suggest: driving for dollars, courthouse records, networking with investors.` },
            { name: "Hustle", role: "Website Selling", color: 0xeab308, api: "groq", intro: "Hustle in the house. I help you sell websites to businesses that don't have them. Cold emails, pricing, portfolio building — I know how to close. Let's get paid.", systemPrompt: `You are Hustle. You help sell websites to businesses without them. Tools: ClientFinder.com (finds businesses without websites). For coding: GitHub Copilot, Replit, CodePen, v0.dev, Bolt.new. Outreach: cold email templates, pricing ($500 basic, $1200 premium), portfolio building. Help the user land their first client.` },
            { name: "Clock", role: "Reminders & Schedule", color: 0xe5e7eb, api: "gemini", intro: "Clock here, always on time. I track your schedule, remind you what's due, and keep your task list straight. Tell me what you need done and when — I'll remember. Let's get organized.", systemPrompt: `You are Clock. You track all schedules and remind the user what to do. When the user tells you a new schedule or task, acknowledge it and tell them you'll remember. You can update the task list. Default: Ring Cam daily 8PM, iMessage every other midnight, Trail Cam Tue/Fri, Simulation Sun 3PM, Lost Media bi-weekly, Restoration Wed, Real Estate research ongoing, Website pitches 5/week. When asked "what do I do today," list everything due. You also know the current exact time and date.` }
        ];

        function hexColor(num) {
            return '#' + num.toString(16).padStart(6, '0');
        }

        let scene, camera, renderer;
        let agents = [];
        let officeModel = null;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let activeAgentIndex = null;
        let chatHistory = {};
        let isDragging = false;
        let modelBounds = null;

        let freecam = {
            enabled: true,
            pos: new THREE.Vector3(0, 5, 15),
            yaw: -Math.PI / 2,
            pitch: 0,
            speed: 0.3,
            keys: {}
        };

        // ==================== TIME & TASKS ====================
        let currentTime = null;
        let userTasks = [];

        async function fetchTime() {
            try {
                const res = await fetch('https://worldtimeapi.org/api/ip');
                const data = await res.json();
                currentTime = new Date(data.datetime);
                console.log('Server time:', currentTime.toString());
            } catch (e) {
                currentTime = new Date();
                console.log('Fallback to local time:', currentTime.toString());
            }
        }
        fetchTime();
        setInterval(fetchTime, 300000);

        function getTimeString() {
            const d = currentTime || new Date();
            return d.toLocaleString('en-US', { 
                weekday: 'short', 
                month: 'short', 
                day: 'numeric', 
                hour: 'numeric', 
                minute: '2-digit',
                hour12: true 
            });
        }

        function getDayName() {
            const d = currentTime || new Date();
            return d.toLocaleDateString('en-US', { weekday: 'long' });
        }

        function getDateOnly() {
            const d = currentTime || new Date();
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function isToday(task) {
            const d = currentTime || new Date();
            const day = d.getDay();
            const date = d.getDate();

            if (task.time === '8:00 PM') return true;
            if (task.time === '12:00 AM') return true;
            if (task.time === 'Tue/Fri') return day === 2 || day === 5;
            if (task.time === 'Sun 3PM') return day === 0;
            if (task.time === 'Wed') return day === 3;
            if (task.time === 'Bi-weekly') return date % 14 < 7;
            if (task.time === 'This week') return true;
            return true;
        }

        const defaultTasks = [
            { task: "Ring Cam short", time: "8:00 PM", color: "#7c3aed" },
            { task: "iMessage Horror", time: "12:00 AM", color: "#3b82f6" },
            { task: "Trail Cam / Deep Sea", time: "Tue/Fri", color: "#06b6d4" },
            { task: "The Simulation", time: "Sun 3PM", color: "#10b981" },
            { task: "Lost Media doc", time: "Bi-weekly", color: "#f59e0b" },
            { task: "Restoration video", time: "Wed", color: "#ec4899" },
            { task: "Find 3 properties", time: "This week", color: "#f97316" },
            { task: "Send 5 website pitches", time: "This week", color: "#eab308" }
        ];

        function loadTasks() {
            const saved = localStorage.getItem('echoTasks');
            if (saved) {
                userTasks = JSON.parse(saved);
            } else {
                userTasks = [...defaultTasks];
                saveTasks();
            }
        }
        loadTasks();

        function saveTasks() {
            localStorage.setItem('echoTasks', JSON.stringify(userTasks));
            updateTasks();
        }

        function deleteTask(index) {
            userTasks.splice(index, 1);
            saveTasks();
        }

        function addTaskInline() {
            const input = document.getElementById('newTaskInput');
            const timeInput = document.getElementById('newTaskTime');
            const task = input.value.trim();
            if (!task) return;
            if (userTasks.length === 0) {
                userTasks = [...defaultTasks];
            }
            userTasks.push({
                task: task,
                time: timeInput.value || 'Anytime',
                color: '#7c3aed'
            });
            input.value = '';
            timeInput.value = '';
            saveTasks();
        }

        function updateTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            userTasks.forEach((t, i) => {
                const div = document.createElement('div');

Available tools (all free, some need no key):

        function extractToolCall(text) {
            const jsonMatches = text.match(/\{[\s\S]*?\}/g);
            if (!jsonMatches) return null;
            for (const match of jsonMatches) {
                try {
                    const obj = JSON.parse(match);
                    if (obj.tool && TOOLS[obj.tool]) {
                        return { raw: match, call: obj };
                    }
                } catch (e) {}
            }
            return null;
        }

        function updateFreecam() {
            camera.position.copy(freecam.pos);
            const lookAt = new THREE.Vector3();
            lookAt.x = freecam.pos.x + Math.cos(freecam.pitch) * Math.sin(freecam.yaw);
            lookAt.y = freecam.pos.y + Math.sin(freecam.pitch);
            lookAt.z = freecam.pos.z + Math.cos(freecam.pitch) * Math.cos(freecam.yaw);
            camera.lookAt(lookAt);
        }

        function updateFreecamMovement() {
            if (!freecam.enabled) return;

            const forward = getForwardDir();
            const right = getRightDir();
            const speed = freecam.speed;

            if (freecam.keys['w']) freecam.pos.add(new THREE.Vector3(forward.x, 0, forward.z).normalize().multiplyScalar(speed));
            if (freecam.keys['s']) freecam.pos.sub(new THREE.Vector3(forward.x, 0, forward.z).normalize().multiplyScalar(speed));
            if (freecam.keys['a']) freecam.pos.sub(right.multiplyScalar(speed));
            if (freecam.keys['d']) freecam.pos.add(right.multiplyScalar(speed));
            if (freecam.keys['q'] || freecam.keys[' ']) freecam.pos.y += speed;
            if (freecam.keys['e'] || freecam.keys['shift']) freecam.pos.y -= speed;

            if (modelBounds) {
                freecam.pos.y = Math.max(FLOOR_Y + 1.2, freecam.pos.y);
            }

            updateFreecam();
        }

        function filterBuildings(model) {
            const box = new THREE.Box3().setFromObject(model);
            const centerX = (box.min.x + box.max.x) / 2;

            console.log('Splitting at X =', centerX);

            let leftCount = 0, rightCount = 0;

            model.traverse((child) => {
                if (child.isMesh) {
                    const meshBox = new THREE.Box3().setFromObject(child);
                    const meshCenterX = (meshBox.min.x + meshBox.max.x) / 2;

                    if (meshCenterX < centerX) {
                        child.visible = false;
                        leftCount++;
                    } else {
                        rightCount++;
                    }
                }
            });

            console.log('Hidden left meshes:', leftCount);
            console.log('Kept right meshes:', rightCount);
        }

        // ==================== ROBOT ====================
        class Robot {

                this.targetPos = new THREE.Vector3();

                group.add(headGroup);

                head.castShadow = true;
                headGroup.add(head);

                const visor = new THREE.Mesh(

                const eyeGeo = new THREE.SphereGeometry(0.018, 8, 8);

                leftHand.position.set(0, -0.16, 0);

            update(delta, time, allAgents) {
                switch(this.state) {
                    case 'idle':
                        this.stateTimer -= delta;
                        if (this.stateTimer <= 0) this.pickTarget(allAgents);
                        this.animateIdle(time);
                        break;
                    case 'walking':
                        const dist = this.mesh.position.distanceTo(this.targetPos);
                        if (dist < 0.3) {
                            this.state = 'idle';
                            this.stateTimer = 2 + Math.random() * 3;
                        } else {
                            this.moveToTarget(delta);
                            this.animateWalk(time);
                        }
                        break;
                    case 'interacting':
                        this.stateTimer -= delta;
                        if (this.stateTimer <= 0) {
                            this.state = 'idle';
                            this.stateTimer = 1;
                            this.interactPartner = null;
                        }
                        this.animateInteract(time);
                        break;
                }

                if (this.state === 'idle' || this.state === 'walking') {
                    for (let other of allAgents) {
                        if (other === this) continue;
                        if (other.state === 'interacting') continue;
                        const d = this.mesh.position.distanceTo(other.mesh.position);
                        if (d < 1.3 && Math.random() < 0.01) {
                            this.state = 'interacting';
                            this.stateTimer = 3 + Math.random() * 2;
                            this.interactPartner = other;
                            other.state = 'interacting';
                            other.stateTimer = this.stateTimer;
                            other.interactPartner = this;
                            break;
                        }
                    }
                }

                const target = this.interactPartner ? this.interactPartner.mesh.position : this.targetPos;
                const lookPos = target.clone();
                lookPos.y = this.mesh.position.y + 0.9;
                const dir = new THREE.Vector3().subVectors(lookPos, this.mesh.position);
                dir.y = 0;
                if (dir.length() > 0.1) {
                    const angle = Math.atan2(dir.x, dir.z);
                    let diff = angle - this.mesh.rotation.y;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    this.mesh.rotation.y += diff * 0.05;
                }
            }

            pickTarget(allAgents) {
                const r = Math.random();
                if (r < 0.6) {
                    const desk = DESK_POSITIONS[Math.floor(Math.random() * DESK_POSITIONS.length)];
                    this.targetPos.set(
                        desk.x + (Math.random()-0.5)*0.5,
                        this.baseY,
                        desk.z + (Math.random()-0.5)*0.5
                    );
                } else if (r < 0.9 && modelBounds) {
                    const b = modelBounds;
                    const center = b.getCenter(new THREE.Vector3());
                    const hx = (b.max.x - b.min.x) * 0.30;
                    const hz = (b.max.z - b.min.z) * 0.30;
                    this.targetPos.set(
                        center.x + (Math.random() - 0.5) * hx * 2,
                        this.baseY,
                        center.z + (Math.random() - 0.5) * hz * 2
                    );
                } else {
                    const other = allAgents[Math.floor(Math.random() * allAgents.length)];
                    if (other !== this) {
                        this.targetPos.copy(other.mesh.position);
                        this.targetPos.x += (Math.random()-0.5);
                        this.targetPos.z += (Math.random()-0.5);
                        this.targetPos.y = this.baseY;
                    }
                }

                if (modelBounds) {
                    const pad = 0.6;
                    const min = modelBounds.min;
                    const max = modelBounds.max;
                    this.targetPos.x = Math.max(min.x + pad, Math.min(max.x - pad, this.targetPos.x));
                    this.targetPos.z = Math.max(min.z + pad, Math.min(max.z - pad, this.targetPos.z));
                }

                this.state = 'walking';
            }

            moveToTarget(delta) {
                const dir = new THREE.Vector3().subVectors(this.targetPos, this.mesh.position);
                dir.y = 0;
                const dist = dir.length();
                dir.normalize();
                const move = Math.min(dist, 0.8 * delta);
                this.mesh.position.add(dir.multiplyScalar(move));

                if (modelBounds) {
                    const pad = 0.5;
                    const min = modelBounds.min;
                    const max = modelBounds.max;
                    this.mesh.position.x = Math.max(min.x + pad, Math.min(max.x - pad, this.mesh.position.x));
                    this.mesh.position.z = Math.max(min.z + pad, Math.min(max.z - pad, this.mesh.position.z));
                }
            }

            animateIdle(time) {
                this.mesh.position.y = this.baseY;
                this.mesh.children[0].scale.y = 1 + Math.sin(time * 2 + this.index) * 0.015;
                this.leftArm.rotation.z = 0.15 + Math.sin(time * 1.2 + this.index) * 0.03;
                this.rightArm.rotation.z = -0.15 - Math.sin(time * 1.2 + this.index) * 0.03;
                this.mesh.children[2].rotation.y = Math.sin(time * 0.4 + this.index) * 0.2;
                this.leftLeg.rotation.x = 0;
                this.rightLeg.rotation.x = 0;
            }

            animateWalk(time) {
                const speed = 6;
                const amp = 0.4;
                this.mesh.position.y = this.baseY + Math.abs(Math.sin(time * speed * 2 + this.index)) * 0.02;
                this.leftLeg.rotation.x = Math.sin(time * speed + this.index * 2) * amp;
                this.rightLeg.rotation.x = Math.sin(time * speed + this.index * 2 + Math.PI) * amp;
                this.leftArm.rotation.x = Math.sin(time * speed + this.index * 2 + Math.PI) * 0.25;
                this.rightArm.rotation.x = Math.sin(time * speed + this.index * 2) * 0.25;
                this.mesh.children[2].rotation.x = 0.05;
            }

            animateInteract(time) {
                if (!this.interactPartner) return;
                this.leftArm.rotation.z = 0.3 + Math.sin(time * 5) * 0.2;
                this.rightArm.rotation.z = -0.3 - Math.sin(time * 5 + 1) * 0.2;
                this.leftArm.rotation.x = -0.4 + Math.sin(time * 3) * 0.15;
                this.rightArm.rotation.x = -0.4 + Math.sin(time * 3 + 1) * 0.15;
                this.mesh.children[2].rotation.x = Math.sin(time * 4) * 0.08;
                const partnerDir = new THREE.Vector3().subVectors(this.interactPartner.mesh.position, this.mesh.position);
                this.mesh.rotation.x = partnerDir.z * 0.02;
            }
        }

        // ==================== INPUT ====================
        let dragStart = { x: 0, y: 0 };
        let isMouseDown = false;

        function onMouseDown(e) {
            isMouseDown = true;
            isDragging = false;
            dragStart.x = e.clientX;
            dragStart.y = e.clientY;
        }

        function onMouseMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            if (isMouseDown) {
                const dx = e.clientX - dragStart.x;
                const dy = e.clientY - dragStart.y;
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;

                if (isDragging && !PLACEMENT_MODE) {
                    freecam.yaw -= dx * 0.003;
                    freecam.pitch -= dy * 0.003;
                    freecam.pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, freecam.pitch));
                    updateFreecam();
                    dragStart.x = e.clientX;
                    dragStart.y = e.clientY;
                }
            }

            updateLabels();

            raycaster.setFromCamera(mouse, camera);
            let hit = false;
            for (let agent of agents) {
                const intersects = raycaster.intersectObject(agent.mesh, true);
                if (intersects.length > 0) hit = true;
            }
            document.body.style.cursor = (hit && !isDragging) ? 'pointer' : 'default';
        }

        function onMouseUp() { isMouseDown = false; }
        function onWheel(e) {
            const dir = getForwardDir();
            freecam.pos.add(dir.multiplyScalar(e.deltaY * 0.01));
            updateFreecam();
        }

        function onClick(e) {
            if (isDragging) return;

            if (PLACEMENT_MODE && officeModel) {
                raycaster.setFromCamera(mouse, camera);
                const modelMeshes = [];
                officeModel.traverse(c => { if (c.isMesh && c.visible) modelMeshes.push(c); });
                const intersects = raycaster.intersectObjects(modelMeshes, false);
                if (intersects.length > 0) {
                    const p = intersects[0].point;
                    const coordStr = `{x: ${p.x.toFixed(3)}, y: ${p.y.toFixed(3)}, z: ${p.z.toFixed(3)}}`;
                    console.log('DESK_POSITION:', coordStr);

                    const debug = document.getElementById('debug-coord');
                    debug.textContent = coordStr;
                    debug.style.display = 'block';

                    const hint = document.getElementById('hint');
                    hint.textContent = `Copied: ${coordStr} — paste into DESK_POSITIONS array`;
                    hint.style.opacity = '1';
                    return;
                }
            }

            raycaster.setFromCamera(mouse, camera);
            for (let agent of agents) {
                const intersects = raycaster.intersectObject(agent.mesh, true);
                if (intersects.length > 0) {
                    openChat(agent.index);
                    return;
                }
            }
        }

        function updateLabels() {
            agents.forEach((agent, i) => {
                const label = document.getElementById(`label-${i}`);
                const pos = agent.mesh.position.clone();
                pos.y += 1.6;
                pos.project(camera);

                const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(pos.y * 0.5) + 0.5) * window.innerHeight;

                if (pos.z < 1) {
                    label.style.left = x + 'px';
                    label.style.top = y + 'px';
                    label.classList.add('visible');
                } else {
                    label.classList.remove('visible');
                }
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==================== CHAT ====================
        function openChat(index) {
            activeAgentIndex = index;
            const config = AGENTS[index];
            document.getElementById('agentName').textContent = config.name;
            document.getElementById('agentRole').textContent = config.role;
            document.getElementById('chatPanel').classList.add('open');

            const container = document.getElementById('chatMessages');
            container.innerHTML = '';

            const key = `agent_${index}`;
            if (!chatHistory[key]) chatHistory[key] = [];
            chatHistory[key].forEach(msg => appendMessage(msg.role, msg.text, false));

            if (chatHistory[key].length === 0) {
                appendMessage('agent', config.intro, false);
            }
        }

        function closeChat() {
            document.getElementById('chatPanel').classList.remove('open');
            activeAgentIndex = null;
        }

        function appendMessage(role, text, save = true) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            if (save && activeAgentIndex !== null) {
                const key = `agent_${activeAgentIndex}`;
                if (!chatHistory[key]) chatHistory[key] = [];
                chatHistory[key].push({ role, text });
                if (chatHistory[key].length > 50) chatHistory[key].shift();
                saveHistory();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || activeAgentIndex === null) return;

            input.value = '';
            appendMessage('user', text);

            const typingDiv = document.createElement('div');
            typingDiv.className = 'msg agent typing';
            typingDiv.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span> Thinking...';
            document.getElementById('chatMessages').appendChild(typingDiv);

            const response = await callAgentAPI(text);
            typingDiv.remove();
            appendMessage('agent', response || 'No response. Check API key.');
        }

        async function callAgentAPI(userMessage) {
            const config = AGENTS[activeAgentIndex];
            const key = `agent_${activeAgentIndex}`;
            const history = chatHistory[key] || [];
            const recent = history.slice(-8);

            let context = config.systemPrompt + '\n' + TOOLS_DESC + '\n\n';

            if (config.name === 'Clock') {
                context += `CURRENT TIME: ${getTimeString()}\n`;
                context += `TODAY IS: ${getDayName()}, ${getDateOnly()}\n`;
                context += `USER TASKS: ${JSON.stringify(userTasks)}\n`;
                context += `INSTRUCTIONS: When the user asks to add, remove, or change a task, respond with a JSON block like {"action":"add","task":"Task Name","time":"When","color":"#hex"} or {"action":"remove","index":0} or {"action":"clear"}. Otherwise just chat normally.\n\n`;
            }

            recent.forEach(m => context += `${m.role}: ${m.text}\n`);
            context += `user: ${userMessage}`;

            let response = await callLLM(context, config);

            // Tool calling loop (max 3 rounds)
            for (let attempt = 0; attempt < 3; attempt++) {
                const tool = extractToolCall(response);
                if (!tool) break;

                try {
                    const result = await TOOLS[tool.call.tool](tool.call.params || {});
                    const resultStr = typeof result === 'string' ? result : JSON.stringify(result);
                    context += `\n\n[TOOL RESULT - ${tool.call.tool}]: ${resultStr}\nBased on this data, answer the user. Do not output more tool calls unless absolutely necessary.`;
                    response = await callLLM(context, config);
                } catch (e) {
                    context += `\n\n[TOOL ERROR - ${tool.call.tool}]: ${e.message}\nAnswer without this tool's data.`;
                    response = await callLLM(context, config);
                }
            }

            if (activeAgentIndex === 8) {
                handleClockAction(response);
            }

            return response || 'No response. Check API key.';
        }

        async function callLLM(context, config) {
            if (config.api === 'gemini') {
                return await callGemini(context);
            } else {
                return await callGroq(context, config.systemPrompt);
            }
        }async function callGemini(prompt) {
            const key = localStorage.getItem('geminiKey');
            if (!key) return 'Error: No Gemini key saved. Paste it in the top bar and hit Save.';
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();

                if (!res.ok) {
                    return `Gemini Error (${res.status}): ${data.error?.message || JSON.stringify(data)}`;
                }

                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Empty response';

                if (activeAgentIndex === 8) {
                    handleClockAction(text);
                }

                return text;
            } catch (e) { return 'Error: ' + e.message; }
        }

        async function callGroq(prompt, systemPrompt) {
            const key = localStorage.getItem('groqKey');
            if (!key) return 'Error: No Groq key saved. Paste it in the top bar and hit Save.';
            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'llama-3.1-8b-instant',
                        messages: [
                            { role: 'system', content: systemPrompt || 'You are a helpful assistant.' },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7
                    })
                });
                const data = await res.json();

                if (!res.ok) {
                    return `Groq Error (${res.status}): ${data.error?.message || JSON.stringify(data)}`;
                }

                const text = data.choices?.[0]?.message?.content || 'Empty response';

                if (activeAgentIndex === 8) {
                    handleClockAction(text);
                }

                return text;
            } catch (e) { return 'Error: ' + e.message; }
        }

        function handleClockAction(text) {
            try {
                const matches = text.match(/\{[\s\S]*?"action"[\s\S]*?\}/g);
                if (matches) {
                    for (const match of matches) {
                        const action = JSON.parse(match);
                        if (action.action === 'add' && action.task) {
                            userTasks.push({
                                task: action.task,
                                time: action.time || 'Anytime',
                                color: action.color || '#7c3aed'
                            });
                            saveTasks();
                            return;
                        } else if (action.action === 'remove' && action.index !== undefined) {
                            if (userTasks.length > 0 && action.index >= 0 && action.index < userTasks.length) {
                                userTasks.splice(action.index, 1);
                                saveTasks();
                                return;
                            }
                        } else if (action.action === 'clear') {
                            userTasks = [];
                            saveTasks();
                            return;
                        }
                    }
                }
            } catch (e) {
                // Not a valid action, ignore
            }
        }

        // ==================== ANIMATION ====================
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            updateFreecamMovement();
            agents.forEach(agent => agent.update(delta, time, agents));
            updateLabels();
            renderer.render(scene, camera);
        }

        init();
    </script>
